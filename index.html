<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draft the Champs</title>
  <meta name="description" content="Draft a team of NFL legends from 1985 to today, then call the plays in random two-minute drill scenarios.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   DRAFT THE CHAMPS — STYLES
   ===================================================================== */
:root {
  --bg: #0a0f1a;
  --bg2: #101828;
  --panel: #141e30;
  --panel2: #1a263c;
  --line: rgba(255, 255, 255, 0.09);
  --line2: rgba(255, 255, 255, 0.16);
  --text: #eef2f8;
  --muted: #94a3b8;
  --gold: #f5b301;
  --gold2: #ffd666;
  --good: #34d27b;
  --bad: #ff5a5f;
  --blue: #3ea0ff;
  --turf: #2f7d45;
  --radius: 14px;
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(245, 179, 1, 0.08), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(62, 160, 255, 0.08), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100vh;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.38; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; }
p { margin: 0; }
.muted { color: var(--muted); }
.center { text-align: center; justify-content: center; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 20px;
  background: rgba(10, 15, 26, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand-mark { font-size: 22px; }
.brand-text { font-family: var(--display); font-size: 28px; letter-spacing: 1.5px; line-height: 1; }
.brand-text em { font-style: normal; color: var(--gold); }
.topbar-right { display: flex; gap: 8px; }
.pill { font-family: var(--cond); font-weight: 600; font-size: 14px; padding: 4px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); }

main { max-width: 1240px; margin: 0 auto; padding: 20px 20px 60px; }

/* ---------- generic ---------- */
.card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.eyebrow { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; font-size: 13px; color: var(--gold); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--cond); font-weight: 700; font-size: 18px; letter-spacing: .5px; text-transform: uppercase;
  padding: 11px 20px; border-radius: 10px; border: 0;
  background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1200;
  box-shadow: 0 6px 18px rgba(245, 179, 1, 0.25), inset 0 -2px 0 rgba(0,0,0,.15);
  transition: transform .12s ease, box-shadow .12s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(245, 179, 1, 0.32); }
.btn.big { font-size: 22px; padding: 14px 26px; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line2); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,.05); }
.btn.alt { background: linear-gradient(180deg, #69b8ff, var(--blue)); color: #04121f; box-shadow: 0 6px 18px rgba(62,160,255,.25); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; margin-top: 12px; }
.cta-row { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
.cta-row.center { justify-content: center; }

/* tiers */
.t-elite { --tier: #c084fc; --tier2: #f5b301; }
.t-gold { --tier: #f5b301; --tier2: #ffd666; }
.t-silver { --tier: #cbd5e1; --tier2: #f1f5f9; }
.t-bronze { --tier: #c8834a; --tier2: #e9a46b; }

/* ---------- helmets ---------- */
.helmet-svg { display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
.hp { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; transition: transform .2s ease; }
.hp-name { font-family: var(--cond); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .3px; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.hp-ovr { font-family: var(--cond); font-weight: 700; font-size: 12px; color: var(--tier); letter-spacing: 1px; }
.hp[data-pid], .slot-h { cursor: pointer; border-radius: 10px; }
.hp[data-pid]:hover { transform: translateY(-3px); }
.hp[data-pid]:hover .hp-name { color: var(--gold2); }
.hp[data-pid]:focus-visible, .slot-h:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.slot-h { display: block; transition: transform .15s; }
.slot-h:hover { transform: scale(1.1); }
.hp.hot { transform: translateY(-4px) scale(1.08); }
.hp.hot .helmet-svg { filter: drop-shadow(0 0 10px rgba(255, 214, 102, .9)); }
.hp.hot .hp-name { color: var(--gold2); }
.hp.warm .hp-name { color: #ffe9a8; }

.legend { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-family: var(--cond); font-weight: 700; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend i { width: 140px; height: 10px; border-radius: 99px; background: linear-gradient(90deg, hsl(54,92%,55%), hsl(27,92%,49%), hsl(0,92%,43%)); }
.legend small { font-size: 12.5px; font-weight: 600; letter-spacing: .5px; margin-left: 6px; }
.card .legend { margin: 12px 0 0; }

/* ---------- home ---------- */
.hero { padding: 36px 0 24px; text-align: center; }
.hero h1 { font-family: var(--display); font-size: clamp(56px, 11vw, 120px); line-height: .9; letter-spacing: 2px; margin: 8px 0 14px; }
.hero h1 span { color: var(--gold); text-shadow: 0 0 40px rgba(245,179,1,.35); }
.lede { max-width: 680px; margin: 0 auto; color: #c9d4e3; font-size: 18px; }
.hero-helmets { display: flex; justify-content: center; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
.setup { max-width: 640px; margin: 10px auto 24px; display: flex; flex-direction: column; gap: 10px; }
.setup h2 { font-family: var(--display); font-size: 32px; letter-spacing: 1px; }
.field-label { font-family: var(--cond); font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.text-in { font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line2); background: #0b1322; color: var(--text); }
.text-in:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { background: var(--panel2); border: 2px solid transparent; border-radius: 12px; padding: 6px 8px; }
.swatch.on { border-color: var(--gold); background: #22314d; }
.start-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.start-row .btn { flex: 1 1 200px; }
.start-note { color: var(--muted); font-size: 13.5px; }
.draft-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 10px 0 24px; }
.how-step { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.how-step b { font-family: var(--display); font-size: 34px; color: var(--gold); line-height: 1; }
.how-step h3 { font-family: var(--cond); font-weight: 700; font-size: 20px; margin: 4px 0 6px; }
.how-step p { color: var(--muted); font-size: 15px; }
.hof h2 { font-family: var(--display); font-size: 30px; margin-bottom: 8px; }
.hof ol { margin: 0; padding-left: 22px; }
.hof li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.hof-name { font-weight: 700; margin-right: 10px; }
.hof-meta { color: var(--muted); font-size: 14px; }

/* ---------- draft ---------- */
.draft { display: grid; grid-template-columns: 340px 1fr; gap: 18px; align-items: start; }
.roster-card { position: sticky; top: 72px; padding: 14px; }
.roster-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.roster-head h2 { font-family: var(--display); font-size: 28px; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team-ovr { font-family: var(--cond); font-weight: 700; color: var(--gold); }
.board { display: flex; flex-direction: column; gap: 4px; }
.slot { display: grid; grid-template-columns: 34px 40px 1fr; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.025); min-height: 44px; }
.slot .helmet-svg { width: 40px; height: 34px; }
.slot-pos { font-family: var(--cond); font-weight: 700; color: var(--muted); font-size: 14px; }
.slot-name { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot-empty { grid-column: 2 / 4; color: #536079; font-size: 14px; }
.slot.now { background: rgba(245,179,1,.12); outline: 1px solid rgba(245,179,1,.5); }
.slot.now .slot-empty { color: var(--gold); font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
.draft-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.draft-head h2 { font-family: var(--display); font-size: clamp(34px, 5vw, 48px); letter-spacing: 1px; line-height: 1; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.pcard {
  text-align: left; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(170deg, var(--panel2), var(--bg2) 70%);
  border: 1px solid var(--line); border-top: 3px solid var(--tier); border-radius: var(--radius);
  padding: 14px; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  animation: dealIn .35s ease both; animation-delay: var(--d);
}
.pcard:hover { transform: translateY(-3px); border-color: var(--tier); box-shadow: 0 12px 28px rgba(0,0,0,.4), 0 0 0 1px var(--tier); }
@keyframes dealIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.pcard-top { display: flex; justify-content: space-between; align-items: flex-start; }
.tier-tag { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px; color: var(--tier); text-align: right; line-height: 1.1; }
.tier-tag small { display: block; color: var(--muted); font-size: 12px; letter-spacing: .5px; }
.pcard-name { font-family: var(--display); font-size: 27px; letter-spacing: .6px; line-height: 1; margin-top: 2px; }
.pcard-meta { font-size: 13px; color: var(--muted); }
.pcard-stats-label { font-family: var(--cond); font-size: 11.5px; text-transform: uppercase; letter-spacing: 1.2px; color: #6b7a93; margin-top: 4px; }
.pcard-stats { display: flex; flex-wrap: wrap; gap: 4px; }
.pcard-stats span { font-family: var(--cond); font-weight: 600; font-size: 14px; background: rgba(255,255,255,.06); border-radius: 6px; padding: 2px 7px; }
.pcard-acc { font-size: 12.5px; color: var(--gold2); }
.note { color: #6b7a93; font-size: 13px; margin-top: 16px; }

/* ovr badges */
.ovr-badge { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 54px; padding: 4px 8px; border-radius: 10px; background: linear-gradient(160deg, var(--tier2), var(--tier)); color: #111; line-height: 1; }
.ovr-badge span { font-family: var(--display); font-size: 30px; }
.ovr-badge small { font-family: var(--cond); font-weight: 700; font-size: 10px; letter-spacing: 1px; }

/* ---------- team review ---------- */
.team-banner { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; }
.team-title { font-family: var(--display); font-size: clamp(42px, 7vw, 72px); letter-spacing: 1.5px; line-height: 1; }
.big-ovr { display: flex; flex-direction: column; align-items: center; padding: 10px 18px; border-radius: 14px; background: linear-gradient(160deg, var(--tier2), var(--tier)); color: #111; line-height: .9; }
.big-ovr span { font-family: var(--display); font-size: 64px; }
.big-ovr small { font-family: var(--cond); font-weight: 700; letter-spacing: 1.5px; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.unit-h { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.lineup { display: flex; flex-wrap: wrap; gap: 12px 8px; justify-content: space-around; }
.ubar { display: grid; grid-template-columns: 90px 1fr 34px; align-items: center; gap: 10px; padding: 5px 0; }
.ubar span { font-family: var(--cond); font-weight: 600; color: var(--muted); }
.ubar-track { height: 10px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden; }
.ubar-track i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 99px; }
.ubar b { font-family: var(--cond); text-align: right; }

/* ---------- pregame ---------- */
.pregame { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.bracket { display: flex; align-items: center; justify-content: center; gap: 0; margin: 6px 0; }
.br { display: flex; align-items: center; gap: 4px; font-family: var(--cond); font-weight: 700; padding: 6px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.br.now { color: #111; background: var(--gold); border-color: var(--gold); }
.br.won { color: var(--good); border-color: rgba(52,210,123,.5); }
.br.lost { color: var(--bad); border-color: rgba(255,90,95,.5); }
.br-line { width: 22px; height: 2px; background: var(--line2); }
.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
.mteam { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mteam h3 { font-family: var(--display); font-size: 28px; letter-spacing: 1px; line-height: 1; }
.vs { font-family: var(--display); font-size: 40px; color: var(--muted); }
.scenario { border-left: 4px solid var(--gold); display: flex; flex-direction: column; gap: 6px; }
.scenario.def { border-left-color: var(--blue); }
.sc-tag { font-family: var(--cond); font-weight: 700; letter-spacing: 2px; color: var(--gold); font-size: 14px; }
.scenario.def .sc-tag { color: var(--blue); }
.sc-score { display: flex; gap: 22px; font-family: var(--display); font-size: 30px; letter-spacing: 1px; flex-wrap: wrap; }
.sc-score b { color: var(--gold2); font-weight: 400; }
.sc-line { color: #c9d4e3; }
.sc-goal { font-weight: 700; font-size: 18px; margin-top: 4px; }

/* ---------- game ---------- */
.game { display: flex; flex-direction: column; gap: 10px; }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; background: #05080f; border: 1px solid var(--line2); border-radius: var(--radius); overflow: hidden; }
.sb-team { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; align-items: center; column-gap: 12px; padding: 10px 16px; border-top: 5px solid var(--tc); position: relative; }
.sb-team.opp { grid-template-columns: auto 1fr; text-align: right; }
.sb-team.opp .sb-score { order: -1; grid-row: 1 / 3; }
.sb-team.opp .sb-name, .sb-team.opp .tos { justify-self: end; }
.sb-name { min-width: 0; font-family: var(--display); font-size: 26px; letter-spacing: 1px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-score { grid-row: 1 / 3; grid-column: 2; font-family: var(--display); font-size: 58px; line-height: 1; color: #fff; }
.sb-team.opp .sb-score { grid-column: 1; }
.tos { display: flex; gap: 4px; }
.tos i { width: 18px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); }
.tos i.on { background: var(--gold); }
.sb-mid { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 20px; background: #0b111d; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.sb-round { font-family: var(--cond); font-weight: 700; font-size: 12px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.sb-clock { font-family: var(--display); font-size: 52px; line-height: 1; color: var(--gold2); font-variant-numeric: tabular-nums; letter-spacing: 2px; }
.sb-clock.urgent { color: var(--bad); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .6; } }
.sb-clockstate { font-family: var(--cond); font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.situation { display: flex; gap: 18px; justify-content: center; align-items: center; flex-wrap: wrap; font-family: var(--cond); font-weight: 600; font-size: 17px; color: #c9d4e3; }
.situation .dd { font-family: var(--display); font-size: 26px; color: #fff; letter-spacing: 1px; background: #05080f; border: 1px solid var(--line2); padding: 2px 12px; border-radius: 8px; }
.field-wrap { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid #1b4b2a; box-shadow: 0 10px 30px rgba(0,0,0,.4); background: #2c7a43; }
.field-canvas { display: block; width: 100%; }
main.wide { max-width: 1680px; }
.field-tools { position: absolute; top: 8px; right: 10px; display: flex; gap: 8px; align-items: center; }
.anim-toggle { display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-weight: 700; font-size: 13px; color: #fff; background: rgba(5,8,15,.7); padding: 5px 10px; border-radius: 8px; cursor: pointer; }
.anim-toggle input { accent-color: var(--gold); margin: 0; }
.skip-btn { font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .5px; color: #111; background: var(--gold); border: 0; border-radius: 8px; padding: 6px 14px; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.skip-btn[hidden] { display: none; }
.field-hint { position: absolute; left: 10px; bottom: 6px; font-family: var(--cond); font-size: 12px; color: rgba(255,255,255,.75); background: rgba(5,8,15,.55); padding: 2px 8px; border-radius: 6px; pointer-events: none; }
.callpanel.locked { opacity: .55; pointer-events: none; }
.field-wrap.flash { animation: flash .8s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(245,179,1,.9); } 100% { box-shadow: 0 0 0 18px rgba(245,179,1,0); } }
.field { display: block; width: 100%; height: clamp(84px, 17vw, 210px); }
.field .ball { transition: transform .7s cubic-bezier(.3,.8,.3,1); }
.field .los, .field .fd-line { transition: x .7s cubic-bezier(.3,.8,.3,1); }
.onfield { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; }
.onfield-label { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; font-size: 13px; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }
.onfield-row { flex: 1; display: flex; justify-content: space-around; gap: 6px; flex-wrap: wrap; }

.game-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.game-grid > *, .draft > * { min-width: 0; }
.cat { min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.panel-head h3 { font-family: var(--display); font-size: 30px; letter-spacing: 1px; line-height: 1; }
.hint { color: var(--muted); font-size: 14px; }
.cats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cats.def { grid-template-columns: repeat(5, 1fr); }
.cat { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); transition: background .12s, border-color .12s; }
.cat i { font-style: normal; font-size: 20px; color: var(--gold); line-height: 1; }
.cat span { font-family: var(--cond); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .4px; text-align: center; line-height: 1.1; }
.cat:hover { border-color: var(--gold); }
.cat.on { background: var(--gold); border-color: var(--gold); color: #111; }
.cat.on i { color: #111; }
.cat-blurb { margin: 10px 2px; color: #c9d4e3; font-size: 15px; }
.plays { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.play { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: #0d1626; border: 1px solid var(--line2); transition: transform .12s, border-color .12s, box-shadow .12s; animation: dealIn .25s ease both; }
.play:hover { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 10px 22px rgba(0,0,0,.35); }
.play-name { font-family: var(--display); font-size: 24px; letter-spacing: .8px; line-height: 1; }
.diagram { width: 100%; height: auto; color: #dfe7f2; background: linear-gradient(180deg, #1d5a33, #17492a); border-radius: 8px; }
.diagram .rt { stroke: var(--gold2); }
.diagram .rt2 { stroke: #8fd0ff; }
.diagram .rt-bad { stroke: #ff7b7f; }
.diagram .zn { fill: rgba(143, 208, 255, .16); stroke: rgba(143, 208, 255, .55); stroke-width: .8; }
.play-desc { font-size: 13.5px; color: #b6c3d6; }
.tags { display: flex; flex-direction: column; gap: 2px; font-family: var(--cond); font-weight: 600; font-size: 13px; color: var(--muted); }
.t-good { color: var(--good); }
.t-bad { color: #ff8a8d; }
.specials { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.tempo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tempo > span { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-size: 13px; margin-right: 4px; }
.seg { font-family: var(--cond); font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line2); background: transparent; }
.seg.on { background: #fff; color: #111; border-color: #fff; }
.sbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.sbtn { font-family: var(--cond); font-weight: 700; font-size: 15px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel2); }
.sbtn:hover:not(:disabled) { border-color: var(--gold); }
.sbtn.hl { border-color: var(--good); color: var(--good); }
.panel-msg { padding: 10px 4px; display: flex; flex-direction: column; gap: 10px; }
.panel-msg h3 { font-family: var(--display); font-size: 34px; letter-spacing: 1px; }
.choice-row { display: flex; gap: 10px; flex-wrap: wrap; }
.huddle { font-family: var(--display); font-size: 28px; letter-spacing: 1px; color: var(--muted); animation: pulse 1s infinite; padding: 30px 0; text-align: center; }

.side { display: flex; flex-direction: column; gap: 12px; }
.lastplay { background: var(--panel); border: 1px solid var(--line2); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.lastplay.good, .lastplay.td { border-color: rgba(52,210,123,.55); background: linear-gradient(180deg, rgba(52,210,123,.12), var(--panel)); }
.lastplay.bad { border-color: rgba(255,90,95,.55); background: linear-gradient(180deg, rgba(255,90,95,.12), var(--panel)); }
.lp-text { font-weight: 600; font-size: 17px; }
.mchip { align-self: flex-start; font-family: var(--cond); font-weight: 700; font-size: 14px; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.08); }
.mchip.good { background: rgba(52,210,123,.18); color: var(--good); }
.mchip.bad { background: rgba(255,90,95,.18); color: #ff8a8d; }
.log { padding: 12px 14px; max-height: 470px; overflow: auto; }
.log h4 { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.log ol { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 38px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log li time { font-family: var(--cond); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.log li em { display: block; font-style: normal; font-size: 12px; color: #6b7a93; }
.log li.good span, .log li.td span { color: #9af0c0; }
.log li.bad span { color: #ffb0b2; }
.log li.whistle span { color: var(--gold2); }
.log li.td span { font-weight: 700; }
.log li.small { padding: 2px 0; font-size: 12.5px; opacity: .8; }

.onfield-hint { display: none; }
@media (min-width: 561px) { .onfield { position: relative; } .onfield-hint { display: block; position: absolute; right: 12px; bottom: 4px; font-size: 11.5px; color: #5d6b84; font-family: var(--cond); letter-spacing: .5px; } }

/* ---------- player info ---------- */
.pinfo { text-align: left; gap: 14px; }
.pinfo-top { display: flex; align-items: center; gap: 16px; }
.pinfo-helmet .helmet-svg { width: 120px; height: 103px; }
.pinfo-pos { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gold); font-size: 13px; }
.pinfo h2 { font-size: 40px; color: var(--text); }
.pinfo-meta { color: var(--muted); }
.pinfo-rating { display: flex; align-items: center; gap: 12px; }
.pinfo-ovr { display: flex; flex-direction: column; align-items: center; padding: 6px 14px; border-radius: 12px; line-height: .9; }
.pinfo-ovr span { font-family: var(--display); font-size: 44px; }
.pinfo-ovr small { font-family: var(--cond); font-weight: 700; font-size: 11px; letter-spacing: 1px; }
.pinfo-tier { font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--tier); }
.pinfo-label { font-family: var(--cond); font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: #6b7a93; margin-bottom: -6px; }
.pinfo-stats span { font-size: 16px; padding: 4px 10px; }
.pinfo-facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: #c9d4e3; }
.pinfo-facts .gold { color: var(--gold2); }
.pinfo .modal-actions { justify-content: flex-end; }
@media (max-width: 560px) { .pinfo-helmet .helmet-svg { width: 84px; height: 72px; } .pinfo h2 { font-size: 32px; } }

/* ---------- overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(3, 6, 12, .72); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; }
.overlay[hidden] { display: none; }
.modal { width: min(520px, 100%); background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line2); border-radius: 18px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: pop .3s ease; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.modal h2 { font-family: var(--display); font-size: 46px; letter-spacing: 1.5px; line-height: 1; }
.modal.win h2 { color: var(--gold); }
.modal.loss h2 { color: #ff8a8d; }
.modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { top: 110vh; transform: rotate(720deg) translateX(40px); } }

/* ---------- responsive ---------- */
@media (max-width: 1000px) {
  .game-grid { grid-template-columns: minmax(0, 1fr); }
  .log { max-height: 300px; }
  .cats { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 860px) {
  .draft { grid-template-columns: 1fr; }
  .roster-card { position: static; order: 2; }
  .grid2 { grid-template-columns: 1fr; }
  .how { grid-template-columns: 1fr; }
  .plays { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  main { padding: 14px 16px 50px; }
  .topbar { padding: 8px 16px; }
  .brand-text { font-size: 22px; }
  .pill { font-size: 12px; padding: 3px 8px; }
  .choices { grid-template-columns: 1fr; }
  .cats { grid-template-columns: repeat(4, 1fr); }
  .cats.def { grid-template-columns: repeat(3, 1fr); }
  .cat span { font-size: 12.5px; }
  .sb-team, .sb-team.opp { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; min-width: 0; }
  .sb-team.opp { align-items: flex-end; }
  .sb-team.opp .sb-score { order: 0; }
  .sb-name { max-width: 100%; }
  .sb-name { font-size: 17px; }
  .sb-score { font-size: 40px; }
  .sb-mid { padding: 6px 8px; }
  .sb-clock { font-size: 36px; }
  .sb-round { font-size: 10px; }
  .tos i { width: 12px; }
  .situation { gap: 10px; font-size: 15px; }
  .onfield { padding: 8px; gap: 6px; }
  .onfield-row { flex-wrap: nowrap; gap: 2px; }
  .onfield .helmet-svg { width: 38px; height: 33px; }
  .onfield .hp-name { font-size: 11px; max-width: 50px; }
  .hp-name { font-size: 12px; max-width: 62px; }
  .matchup { grid-template-columns: 1fr; }
  .mteam h3 { font-size: 24px; }
  .team-banner { flex-direction: column; align-items: flex-start; }
  .hero-helmets .helmet-svg { width: 46px; height: 40px; }
}

/* ---------- salary cap ---------- */
.cap { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.cap-row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--cond); font-weight: 700; }
.cap-row span { text-transform: uppercase; letter-spacing: 1.2px; font-size: 13px; color: var(--muted); }
.cap-row b { font-size: 18px; color: var(--good); font-variant-numeric: tabular-nums; }
.cap-row b.tight { color: #ffb15c; }
.cap-track { height: 8px; margin: 6px 0 4px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.cap-track i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #34d27b, #f5b301 70%, #ff5a5f); }
.cap-sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pcard-sal { display: flex; align-items: baseline; gap: 8px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); font-family: var(--cond); }
.pcard-sal span { text-transform: uppercase; letter-spacing: 1px; font-size: 12px; color: var(--muted); }
.pcard-sal b { font-size: 18px; font-variant-numeric: tabular-nums; }
.pcard-sal em { margin-left: auto; font-style: normal; font-weight: 700; font-size: 13px; color: #ff8a8d; }
.pcard.over { opacity: .5; filter: grayscale(.6); cursor: not-allowed; }
.pcard.over:hover { transform: none; box-shadow: none; border-color: var(--line); }
.pcard.shake { animation: shake .35s ease; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.team-pay { display: flex; flex-direction: column; align-items: flex-end; margin-left: auto; font-family: var(--cond); line-height: 1.1; }
.team-pay span { text-transform: uppercase; letter-spacing: 1.2px; font-size: 12px; color: var(--muted); }
.team-pay b { font-family: var(--display); font-size: 36px; font-weight: 400; }
.team-pay small { font-size: 13px; color: var(--muted); }
@media (max-width: 560px) { .team-pay { margin-left: 0; align-items: flex-start; } }

/* ---------- game layout: plays left, vertical field right ---------- */
.game-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 560px); gap: 14px; align-items: start; }
.game-left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.game-right { position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); min-width: 0; }
.game-left .plays { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.game-left .log { max-height: 340px; }
@media (max-width: 1100px) { .game-left .cats { grid-template-columns: repeat(4, 1fr); } .game-left .plays { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .game-main { grid-template-columns: 1fr; }
  .game-right { position: static; order: -1; }
}

/* ---------- footer ---------- */
.site-foot { display: flex; justify-content: center; padding: 28px 16px calc(36px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); margin-top: 20px; }
.ig-btn { display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border-radius: 999px; text-decoration: none;
  font-family: var(--cond); font-weight: 700; font-size: 17px; letter-spacing: .4px; color: #fff;
  background: var(--panel2); border: 1px solid var(--line2); box-shadow: 0 8px 22px rgba(0,0,0,.3); transition: transform .15s ease, border-color .15s ease; }
.ig-btn:hover { transform: translateY(-2px); border-color: var(--gold); }
.ig-btn svg { color: var(--gold); }
.ig-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.ig-btn svg { width: 22px; height: 22px; }

const POS_NAMES = {
  QB: "Quarterback", RB: "Running Back", WR: "Wide Receiver", TE: "Tight End",
  OL: "Offensive Line", DL: "Defensive Line", LB: "Linebacker", CB: "Cornerback",
  S: "Safety", K: "Kicker",
};

/* ---------------------------------------------------------------------
   Turn raw rows into player objects with per-17-game season averages
   and a stat-based score. Scores are then converted to 60–99 ratings.
   --------------------------------------------------------------------- */
function buildPlayers() {
  const all = [];
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const one = (n) => (Math.round(n * 10) / 10).toFixed(1);

  for (const pos of Object.keys(PLAYER_DATA)) {
    const list = [];
    for (const r of PLAYER_DATA[pos]) {
      const [name, team, from, to, g] = r;
      const seasons = Math.max(1, g / 16);
      const per = (x) => (x / g) * 17; // per-17-game season average
      let p = { pos, name, team, from, to, g, seasons, num: JERSEY[name] ?? "" };
      let acc = 0, score = 0, line = [];
      // Era adjustment: passing numbers have risen over time, so older
      // players get credit relative to the league they played in.
      const mid = (from + (to || 2025)) / 2;
      const era = 1 + (2015 - mid) * 0.006;

      if (pos === "QB") {
        const [, , , , , yds, td, int, rate, rush, pb, ap] = r;
        Object.assign(p, { pb, ap });
        const lgRate = 76 + (mid - 1990) * 0.45;
        score = (rate - lgRate) * 0.12 + (per(yds) * era - 3200) / 450 + (per(td) - 20) / 6
              - (per(int) - 12) / 8 + per(rush) / 600;
        line = [`${fmt(per(yds))} YDS`, `${fmt(per(td))} TD`, `${fmt(per(int))} INT`, `${one(rate)} RTG`];
        if (per(rush) >= 250) line.push(`${fmt(per(rush))} RUSH`);
      } else if (pos === "RB") {
        const [, , , , , ry, rtd, ypc, rec, recy, pb, ap] = r;
        Object.assign(p, { pb, ap });
        score = (per(ry) - 800) / 220 + (per(rtd) - 6) / 3.5 + (ypc - 4.2) * 1.4 + per(recy) / 500;
        line = [`${fmt(per(ry))} RUSH YDS`, `${fmt(per(rtd))} TD`, `${one(ypc)} YPC`, `${fmt(per(rec))} REC`];
      } else if (pos === "WR" || pos === "TE") {
        const [, , , , , rec, yds, td, pb, ap] = r;
        Object.assign(p, { pb, ap });
        const base = pos === "WR" ? 900 : 600;
        score = (per(yds) * era - base) / 220 + (per(td) - 5) / 2.6 + per(rec) / 60 - 1;
        line = [`${fmt(per(rec))} REC`, `${fmt(per(yds))} YDS`, `${fmt(per(td))} TD`, `${one(yds / rec)} Y/R`];
      } else if (pos === "OL") {
        const [, , , , , pb, ap, spot] = r;
        Object.assign(p, { pb, ap, spot });
        score = Math.log(seasons) * 0.8;
        line = [`${spot === "T" ? "Tackle" : spot === "G" ? "Guard" : "Center"}`, `${g} GAMES`, `${one(seasons)} SEASONS`];
      } else if (pos === "DL") {
        const [, , , , , sk, ff, pb, ap] = r;
        Object.assign(p, { pb, ap });
        score = (per(sk) - 6) / 2.2 + per(ff) / 2.5;
        line = [`${one(per(sk))} SACKS`, `${one(per(ff))} FF`, `${g} GAMES`];
      } else if (pos === "LB") {
        const [, , , , , tk, sk, int, pb, ap] = r;
        Object.assign(p, { pb, ap });
        score = (per(tk) - 80) / 40 + per(sk) / 3.5 + per(int) / 1.3;
        line = [`${fmt(per(tk))} TKL`, `${one(per(sk))} SACKS`, `${one(per(int))} INT`];
      } else if (pos === "CB" || pos === "S") {
        const [, , , , , int, x, pb, ap] = r;
        Object.assign(p, { pb, ap });
        score = per(int) / 1.1 + per(x) / (pos === "CB" ? 1.2 : 2.5);
        line = [`${one(per(int))} INT`, pos === "CB" ? `${one(per(x))} DEF TD` : `${one(per(x))} FF`, `${g} GAMES`];
      } else if (pos === "K") {
        const [, , , , , fgm, fga, long, pb, ap] = r;
        Object.assign(p, { pb, ap });
        const pct = (fgm / fga) * 100;
        p.fgPct = pct; p.long = long;
        score = (pct - 80) / 2.2 + (long - 55) / 4;
        line = [`${one(pct)}% FG`, `${fmt(per(fgm))} FGM`, `LONG ${long}`];
      }

      // Accolades: Pro Bowls and 1st-team All-Pro per season played
      acc = (p.pb + p.ap * 1.6) / seasons;
      const accWeight = pos === "OL" ? 6 : 3;
      p.raw = score + acc * accWeight + Math.min(seasons, 12) * 0.05;
      p.statLine = line;
      p.id = `${pos}-${name}`.replace(/[^a-z0-9]+/gi, "-").toLowerCase();
      list.push(p);
    }

    // Short careers get pulled a little toward the middle of the pack
    const med = [...list].sort((a, b) => a.raw - b.raw)[Math.floor(list.length / 2)].raw;
    for (const p of list) {
      const pull = (1 - Math.min(1, p.seasons / 5)) * 0.35;
      p.raw = p.raw * (1 - pull) + med * pull;
    }

    // Convert raw scores to 66–99 ratings within each position
    const sorted = [...list].sort((a, b) => a.raw - b.raw);
    const min = sorted[0].raw, max = sorted[sorted.length - 1].raw;
    sorted.forEach((p, i) => {
      const pct = sorted.length > 1 ? i / (sorted.length - 1) : 1;
      const mm = (p.raw - min) / (max - min || 1);
      p.ovr = Math.round(66 + 33 * (0.55 * mm + 0.45 * pct));
    });
    all.push(...list);
  }
  return all;
}

const PLAYERS = buildPlayers();
if (typeof module !== "undefined") module.exports = { PLAYERS, POS_NAMES };

  <script>
/* =====================================================================
   DRAFT THE CHAMPS — GAME ENGINE
   Simulates the two-minute drill: clock, downs, scoring, play results.
   "you" = the player's drafted team, "opp" = the computer team.
   ===================================================================== */

(function (root) {
  const PB = root.PLAYBOOK || require("./playbook.js");
  const { ALL_OFF_PLAYS, ALL_DEF_PLAYS, OFFENSE_PLAYBOOK, DEFENSE_PLAYBOOK, TAG_NAMES } = PB;

  // ---------- helpers ----------
  const rand = Math.random;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
  function normal(mean, sd) {
    let u = 0, v = 0;
    while (!u) u = rand();
    while (!v) v = rand();
    return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  function weighted(obj) {
    const entries = Object.entries(obj).filter(([, w]) => w > 0);
    let total = entries.reduce((s, [, w]) => s + w, 0);
    let r = rand() * total;
    for (const [k, w] of entries) { if ((r -= w) <= 0) return k; }
    return entries[entries.length - 1][0];
  }
  const other = (side) => (side === "you" ? "opp" : "you");
  const fmtClock = (s) => {
    s = Math.max(0, Math.ceil(s));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };
  function spotText(state, side, ballOn) {
    // ballOn is measured from `side`'s own goal line
    if (ballOn === 50) return "the 50";
    const name = side === "you" ? "your" : `${state.opp.nick}`;
    const oppName = side === "you" ? `${state.opp.nick}` : "your";
    return ballOn < 50 ? `${name} ${ballOn}` : `${oppName} ${100 - ballOn}`;
  }

  const TEMPO_RUNOFF = { hurry: 13, normal: 26, milk: 39 };

  // ---------- field goal odds ----------
  function fgProb(dist, kOvr, kLong) {
    const pts = [[20, 0.995], [30, 0.97], [35, 0.94], [40, 0.89], [45, 0.83], [50, 0.73], [55, 0.58], [60, 0.38], [64, 0.2], [68, 0.06], [72, 0.01]];
    let p = 0;
    if (dist <= 20) p = 0.995;
    else if (dist >= 72) p = 0.005;
    else for (let i = 0; i < pts.length - 1; i++) {
      const [d1, p1] = pts[i], [d2, p2] = pts[i + 1];
      if (dist >= d1 && dist <= d2) { p = p1 + ((dist - d1) / (d2 - d1)) * (p2 - p1); break; }
    }
    p += (kOvr - 82) * 0.004 * (dist > 40 ? 1.6 : 1);
    if (kLong && dist > kLong + 2) p *= 0.55;
    return clamp(p, 0.005, 0.995);
  }

  // ---------- state ----------
  function newGame({ you, opp, scenario }) {
    const s = {
      you: { ...you, score: scenario.youScore, to: scenario.youTO },
      opp: { ...opp, score: scenario.oppScore, to: scenario.oppTO },
      clock: scenario.clock,
      clockRunning: false,
      poss: scenario.poss,
      ballOn: scenario.ballOn,
      down: 1,
      toGo: 10,
      phase: "play",
      pending: null,
      tempo: "hurry",
      log: [],
      last: null,
      result: null,
      twoMinWarned: scenario.clock <= 120,
      plays: 0,
    };
    s.toGo = Math.min(10, 100 - s.ballOn);
    autoTempo(s);
    return s;
  }

  function autoTempo(s) {
    // For the user's offense: hurry when behind/tied, milk when ahead
    const margin = s.you.score - s.opp.score;
    s.tempo = margin > 0 ? "milk" : "hurry";
  }

  function log(s, text, kind = "info", extra = {}) {
    const entry = { text, kind, clock: fmtClock(s.clock), ...extra };
    s.log.unshift(entry);
    return entry;
  }

  // Run the clock. Returns true if the two-minute warning stopped it.
  function tick(s, sec) {
    const before = s.clock;
    s.clock = Math.max(0, s.clock - sec);
    if (!s.twoMinWarned && before > 120 && s.clock <= 120) {
      s.clock = 120;
      s.twoMinWarned = true;
      s.clockRunning = false;
      log(s, "⏱ Two-minute warning", "whistle");
      return true;
    }
    return false;
  }

  function setPossession(s, side, ballOn) {
    s.poss = side;
    s.ballOn = clamp(Math.round(ballOn), 1, 99);
    s.down = 1;
    s.toGo = Math.min(10, 100 - s.ballOn);
    s.clockRunning = false;
    if (side === "you") autoTempo(s);
  }

  // ---------- units & names ----------
  function units(team) { return team.units; }
  function nameOf(team, key, fallback) {
    if (team.names && team.names[key]) return team.names[key];
    return `${team.nick} ${fallback || key}`;
  }
  function defenderName(team, kind) {
    // kind: sack | int | tackle | breakup
    const n = team.names;
    if (!n) {
      const pos = { sack: "DL", int: "DB", tackle: "LB", breakup: "CB" }[kind];
      return `${team.nick} ${pos}`;
    }
    const opts = {
      sack: [n.DL1, n.DL1, n.DL2, n.LB],
      int: [n.CB1, n.CB2, n.S, n.S, n.LB],
      tackle: [n.LB, n.LB, n.S, n.DL1, n.DL2],
      breakup: [n.CB1, n.CB2, n.S],
    }[kind];
    return pick(opts.filter(Boolean)) || "the defense";
  }

  // ---------- matchups ----------
  function matchup(off, def) {
    if (!off || !def) return 0;
    if ((off.beats || []).some((t) => def.tags.includes(t))) return 1;
    if ((off.weak || []).some((t) => def.tags.includes(t))) return -1;
    return 0;
  }
  function matchupText(off, def, m) {
    if (m > 0) return `${off.name} beat ${def.name}`;
    if (m < 0) return `${def.name} took away ${off.name}`;
    return `${off.name} vs ${def.name}`;
  }

  // ---------- play resolution ----------
  function resolveRun(s, off, def, O, D) {
    const ou = O.units, du = D.units;
    const m = matchup(off, def);
    const runOff = 0.55 * ou.RB + 0.45 * ou.OL;
    const runDef = 0.5 * du.DL + 0.35 * du.LB + 0.15 * du.S;
    const diff = runOff - runDef;
    let mean = off.run + def.run + diff * 0.07 + m * 1.6;
    if (off.shortYd && s.toGo <= 2) mean += off.shortYd;
    let yards = Math.round(normal(mean, off.sd));
    yards = Math.max(yards, -4);
    let big = false;
    if (rand() < off.big + diff * 0.002 + (m > 0 ? 0.05 : 0)) {
      yards += randInt(8, 40);
      big = true;
    }
    const fumble = rand() < clamp(0.012 - diff * 0.0004 + (m < 0 ? 0.006 : 0), 0.003, 0.03);
    const oob = yards > 0 && rand() < off.oob;
    const rb = nameOf(O, "RB", "RB");
    return { kind: "run", yards, fumble, oob, big, m, time: randInt(5, 7), rb };
  }

  function chooseTarget(O, D, off, forced) {
    if (forced && off.tgt && off.tgt[forced] !== undefined) return forced;
    const w = {};
    for (const [k, v] of Object.entries(off.tgt || { WR1: 1 })) w[k] = v * Math.pow(O.units[k] / 80, 3);
    return weighted(w);
  }

  function resolvePass(s, off, def, O, D) {
    const ou = O.units, du = D.units;
    const m = matchup(off, def);
    const tgtKey = chooseTarget(O, D, off);
    const tgtR = ou[tgtKey];
    const defKey = { WR1: "CB1", WR2: "CB2", TE: "S", RB: "LB" }[tgtKey];
    const defR = defKey === "S" ? (du.S + du.LB) / 2 : du[defKey];
    const cover = off.depth === "deep" ? 0.55 * defR + 0.45 * du.S : 0.75 * defR + 0.25 * du.S;
    const passOff = 0.45 * ou.QB + 0.4 * tgtR + 0.15 * ou.OL;
    const qb = nameOf(O, "QB", "QB");
    const tgt = nameOf(O, tgtKey, tgtKey.replace(/\d/, ""));
    const time = off.depth === "deep" ? randInt(6, 9) : randInt(4, 7);

    // Sack?
    let sackP = (off.sack ?? 0.05) + def.rush + (du.DL - ou.OL) * 0.0035 - (ou.QB - 82) * 0.001;
    if (m < 0 && def.tags.includes("blitz")) sackP += 0.05;
    if (m > 0 && def.tags.includes("blitz")) sackP -= 0.04;
    if (rand() < clamp(sackP, 0.005, 0.32)) {
      const yards = -randInt(4, 10);
      const fumble = rand() < 0.09;
      return { kind: "sack", yards, fumble, m, time: randInt(5, 7), qb, tgt, tgtKey };
    }

    const depth = off.depth || "short";
    let comp = off.comp + 0.035 + (def.comp[depth] || 0) + m * 0.11 + (passOff - cover) * 0.011;
    comp = clamp(comp, 0.08, 0.93);
    let intP = clamp(off.int + (cover - ou.QB) * 0.0015 + (m < 0 ? 0.02 : 0) - (m > 0 ? 0.01 : 0), 0.004, 0.16);

    const r = rand();
    if (r < comp) {
      let air = Math.max(off.air + normal(0, off.sd), -3);
      let yac = Math.max(0, normal(off.yac + (def.soft || 0), off.yacSd || 2.5));
      let yards = (air + yac) * (1 + (tgtR - defR) * 0.006) * (m > 0 ? 1.18 : m < 0 ? 0.85 : 1);
      let big = false;
      if (rand() < (off.big || 0.03) + (tgtR - defR) * 0.002 + (m > 0 ? 0.03 : 0) - (def.tags.includes("prev") ? 0.02 : 0)) {
        yards += randInt(10, 45);
        big = true;
      }
      yards = Math.round(yards);
      const airR = Math.round(Math.min(air, Math.max(yards, -3)));
      const oob = rand() < off.oob;
      const fumble = rand() < 0.008;
      return { kind: "complete", yards, air: airR, oob, fumble, big, m, time, qb, tgt, tgtKey };
    } else if (r < comp + intP) {
      const airYards = Math.max(3, Math.round(off.air + normal(0, off.sd)));
      return { kind: "int", yards: 0, airYards, m, time, qb, tgt, tgtKey };
    }
    return { kind: "incomplete", yards: 0, m, time, qb, tgt, tgtKey };
  }

  function resolveHailMary(s, O, D) {
    const ou = O.units, du = D.units;
    const toGoal = 100 - s.ballOn;
    const qb = nameOf(O, "QB", "QB");
    const tgt = nameOf(O, "WR1", "WR");
    if (rand() < clamp(0.07 + (du.DL - ou.OL) * 0.003, 0.02, 0.15)) {
      return { kind: "sack", yards: -randInt(6, 12), fumble: rand() < 0.1, m: 0, time: 7, qb, tgt };
    }
    const reach = 50 + (ou.QB - 80) * 0.4 + randInt(0, 12);
    let p = clamp(0.09 + (ou.WR1 + ou.TE - du.S - du.CB1) * 0.002, 0.03, 0.18);
    if (toGoal > reach) p = 0;
    const r = rand();
    if (r < p) return { kind: "complete", yards: toGoal, oob: false, fumble: false, big: true, m: 0, time: 9, qb, tgt, hail: true };
    if (r < p + 0.22) return { kind: "int", yards: 0, airYards: Math.min(toGoal - 2, 50), m: 0, time: 9, qb, tgt };
    return { kind: "incomplete", yards: 0, m: 0, time: 9, qb, tgt, hail: true };
  }

  // ---------- CPU play calling ----------
  function cpuDefenseCall(s) {
    // Called when "you" have the ball
    const deficit = s.opp.score - s.you.score; // CPU's lead
    const toGoal = 100 - s.ballOn;
    let w = { blitz: 18, man: 24, zone: 34, prevent: 10, runstop: 14 };
    if (s.toGo <= 2) { w.runstop += 25; w.prevent = 0; }
    if (s.toGo >= 10) { w.runstop = 4; w.zone += 10; }
    if (deficit > 0 && s.clock < 45 && toGoal > 25) { w.prevent += 35; w.blitz -= 8; }
    if (deficit < 0) { w.runstop += 20; w.blitz += 10; w.prevent = 0; } // you're ahead: CPU sells out vs the run
    if (toGoal <= 10) { w.prevent = 0; w.man += 15; w.blitz += 8; }
    const cat = weighted(w);
    const plays = DEFENSE_PLAYBOOK.find((c) => c.id === cat).plays;
    let play = pick(plays);
    if (cat === "runstop" && toGoal > 5 && play.id === "goalline") play = plays[0];
    return ALL_DEF_PLAYS[play.id];
  }

  function cpuOffenseCall(s) {
    const lead = s.opp.score - s.you.score;
    const toGoal = 100 - s.ballOn;
    let w;
    if (lead > 0) w = { inside: 45, outside: 25, quick: 20, screen: 10 };
    else if (s.clock < 40 || s.toGo >= 12) w = { sideline: 38, mid: 26, quick: 12, deep: 16, screen: 8 };
    else w = { inside: 10, outside: 8, quick: 20, sideline: 22, mid: 20, deep: 10, screen: 10 };
    if (s.toGo <= 2 && lead <= 0 && s.clock > 25) { w.inside = (w.inside || 0) + 30; }
    if (toGoal <= 12) { w.deep = 0; w.quick = (w.quick || 0) + 10; }
    const cat = weighted(w);
    return ALL_OFF_PLAYS[pick(OFFENSE_PLAYBOOK.find((c) => c.id === cat).plays).id];
  }

  // Can the team with the ball kneel out the clock?
  function canKneelOut(s, side) {
    const defTO = s[other(side)].to;
    let t = s.clock, running = s.clockRunning, to = defTO;
    for (let d = s.down; d <= 4; d++) {
      if (running) {
        if (to > 0) { to--; } else { t -= 40; }
      }
      t -= 1;
      running = true;
      if (t <= 0) return true;
      if (d === 4) return false;
    }
    return t <= 0;
  }

  // Decide what the CPU does before the snap when it has the ball.
  // Returns {type:'play'} (needs user defense call) or a special action.
  function cpuOffenseDecision(s) {
    const lead = s.opp.score - s.you.score;
    const dist = 100 - s.ballOn + 17;
    const k = s.opp.units;
    const fgP = fgProb(dist, k.K, k.KLong);
    const need = -lead; // points needed to tie (0 = tied)

    if (lead > 0 && canKneelOut(s, "opp")) return { type: "kneel" };
    if (lead === 0 && s.ballOn < 35 && s.clock < 22 && !s.clockRunning) return { type: "kneel" };

    // Clock management when trailing or tied
    if (lead <= 0 && s.clockRunning) {
      if (s.opp.to > 0 && s.clock < 105) return { type: "timeout" };
      if (s.clock < 28 && s.down < 4 && s.clock > 3) return { type: "spike" };
    }
    // Last-second field goal
    if (need <= 3 && fgP > 0.25 && (s.clock <= 6 || (s.down === 4))) return { type: "fg" };
    if (need <= 3 && fgP > 0.45 && s.clock <= 12 && !s.clockRunning) return { type: "fg" };
    // Leading: kick or punt on 4th
    if (s.down === 4 && lead > 0) {
      if (fgP > 0.7) return { type: "fg" };
      if (s.ballOn < 60 || s.toGo > 3) return { type: "punt" };
    }
    if (s.down === 4 && lead === 0 && s.ballOn < 40 && s.clock > 75) return { type: "punt" };
    // Desperation
    if (lead <= 0 && s.clock <= 7 && toGoalCheck(s) > 28) return { type: "hail" };
    return { type: "play" };
  }
  const toGoalCheck = (s) => 100 - s.ballOn;

  // ---------- applying results ----------
  function score(s, side, pts) { s[side].score += pts; }

  function afterScoreKick(s, kicker) {
    if (s.clock <= 0) return endGame(s);
    s.phase = "kick";
    s.pending = { side: kicker };
    s.clockRunning = false;
    if (kicker === "opp") cpuKick(s);
    else if (s.you.score >= s.opp.score) kickoff(s, "you", "deep");
  }

  function kickoff(s, kicker, type) {
    const recv = other(kicker);
    s.phase = "play";
    s.pending = null;
    if (type === "onside") {
      const ok = rand() < 0.12;
      tick(s, 4);
      if (ok) {
        log(s, `🏈 Onside kick… RECOVERED by the ${kicker === "you" ? s.you.name : s.opp.nick}!`, "big");
        setPossession(s, kicker, 45);
      } else {
        log(s, `Onside kick recovered by the ${recv === "you" ? s.you.name : s.opp.nick}.`, "info");
        setPossession(s, recv, 55);
      }
    } else {
      if (rand() < 0.65) {
        log(s, "Kickoff: touchback.", "info");
        setPossession(s, recv, 35);
      } else {
        const spot = randInt(22, 42);
        tick(s, randInt(4, 7));
        log(s, `Kickoff returned to the ${spot}.`, "info");
        setPossession(s, recv, spot);
      }
    }
    if (s.clock <= 0) endGame(s);
  }

  function cpuKick(s) {
    const trailing = s.opp.score < s.you.score;
    kickoff(s, "opp", trailing && s.clock < 200 ? "onside" : "deep");
  }

  function touchdown(s, side, text) {
    score(s, side, 6);
    log(s, `🏈 TOUCHDOWN ${side === "you" ? s.you.name : s.opp.nick}! ${text}`, side === "you" ? "td" : "bad");
    s.phase = "pat";
    s.pending = { side };
    s.clockRunning = false;
    if (side === "opp") cpuPAT(s);
  }

  function pat(s, side, type) {
    const O = s[side], D = s[other(side)];
    let good;
    if (type === "2") {
      const p = clamp(0.47 + (0.5 * O.units.QB + 0.5 * O.units.WR1 - 0.5 * D.units.CB1 - 0.5 * D.units.LB) * 0.006, 0.3, 0.65);
      good = rand() < p;
      if (good) score(s, side, 2);
      log(s, `Two-point try… ${good ? "GOOD!" : "no good."}`, good === (side === "you") ? "good" : "bad");
    } else {
      const p = clamp(0.93 + (O.units.K - 82) * 0.003, 0.85, 0.99);
      good = rand() < p;
      if (good) score(s, side, 1);
      log(s, `Extra point ${good ? "is good." : "is NO GOOD!"}`, good ? "info" : (side === "you" ? "bad" : "good"));
    }
    s.pending = null;
    afterScoreKick(s, side);
  }

  function cpuPAT(s) {
    const margin = s.opp.score - s.you.score; // after the TD
    const goFor2 = [-2, -5, -10, 1, 5].includes(margin) && s.clock < 400;
    pat(s, "opp", goFor2 ? "2" : "1");
  }

  function changeOnDowns(s) {
    const side = other(s.poss);
    log(s, "Turnover on downs!", side === "you" ? "good" : "bad");
    setPossession(s, side, 100 - s.ballOn);
  }

  function safety(s) {
    const def = other(s.poss);
    score(s, def, 2);
    log(s, "SAFETY! Two points.", def === "you" ? "good" : "bad");
    if (s.clock <= 0) return endGame(s);
    setPossession(s, def, 40);
    log(s, "Free kick after the safety.", "info");
  }

  function applyResult(s, res, offPlay, defPlay) {
    const side = s.poss, O = s[side], D = s[other(side)];
    const youOff = side === "you";
    const tag = defPlay && offPlay ? { matchup: res.m, mtext: matchupText(offPlay, defPlay, res.m), off: offPlay.name, def: defPlay.name } : {};
    s.last = { ...res, offName: offPlay ? offPlay.name : null, defName: defPlay ? defPlay.name : null,
      offId: offPlay ? offPlay.id : null, defId: defPlay ? defPlay.id : null, side };
    s.plays++;

    // 2-minute warning hit during the play?
    const warned = tick(s, res.time);
    s.clockRunning = true;
    const goodFor = (offGood) => (offGood === youOff ? "good" : "bad");

    if (res.kind === "int") {
      const defName = defenderName(D, "int");
      let spot = s.ballOn + res.airYards; // where the INT happened (offense's frame)
      let ret = Math.max(0, Math.round(normal(6, 8)));
      if (rand() < 0.04) ret = 100;
      const newBall = 100 - spot + ret;
      log(s, `🚨 INTERCEPTED! ${res.qb}'s pass is picked off by ${defName}.`, goodFor(false), { ...tag, big: true });
      s.clockRunning = false;
      if (newBall >= 100) return touchdown(s, other(side), "Pick-six!");
      if (newBall <= 0) return setPossession(s, other(side), 20);
      setPossession(s, other(side), newBall);
      if (s.clock <= 0) endGame(s);
      return;
    }

    if (res.kind === "incomplete") {
      const who = rand() < 0.4 ? ` — broken up by ${defenderName(D, "breakup")}` : "";
      log(s, `${res.hail ? "Hail Mary falls incomplete" : `Pass to ${res.tgt} incomplete${who}`}.`, goodFor(false), tag);
      s.clockRunning = false;
      return advanceDown(s, 0);
    }

    const yards = res.yards;
    let text;
    if (res.kind === "sack") {
      text = `💥 ${res.qb} SACKED by ${defenderName(D, "sack")} for a loss of ${-yards}.`;
    } else if (res.kind === "run") {
      if (yards < 0) text = `${res.rb} stuffed by ${defenderName(D, "tackle")} for a loss of ${-yards}.`;
      else if (yards === 0) text = `${res.rb} is stopped for no gain.`;
      else text = `${res.rb} ${res.big ? "breaks loose" : "runs"} for ${yards} yard${yards === 1 ? "" : "s"}${res.oob ? " and gets out of bounds" : ""}.`;
    } else {
      text = res.hail
        ? `🙏 HAIL MARY… CAUGHT by ${res.tgt}!`
        : `${res.qb} to ${res.tgt} for ${yards} yard${Math.abs(yards) === 1 ? "" : "s"}${res.oob ? ", out of bounds" : ""}${res.big ? " — big play!" : "."}`;
    }

    // Fumble
    if (res.fumble && s.ballOn + yards > 0 && s.ballOn + yards < 100) {
      log(s, text + ` FUMBLE! Recovered by the defense.`, goodFor(false), { ...tag, big: true });
      s.clockRunning = false;
      setPossession(s, other(side), 100 - (s.ballOn + yards));
      if (s.clock <= 0) endGame(s);
      return;
    }

    const newBall = s.ballOn + yards;
    if (newBall >= 100) {
      log(s, text, goodFor(true), { ...tag, big: true });
      return touchdown(s, side, "");
    }
    if (newBall <= 0) {
      log(s, text, goodFor(false), tag);
      return safety(s);
    }
    log(s, text, yards >= 8 ? goodFor(true) : yards <= 0 ? goodFor(false) : "info", { ...tag, big: res.big });
    if (res.oob) s.clockRunning = false;
    if (warned) s.clockRunning = false;
    s.ballOn = newBall;
    advanceDown(s, yards);
  }

  function advanceDown(s, yards) {
    s.toGo -= yards;
    if (s.toGo <= 0) {
      s.down = 1;
      s.toGo = Math.min(10, 100 - s.ballOn);
      if (s.clock > 0) log(s, "First down!", s.poss === "you" ? "good" : "bad", { small: true });
    } else {
      s.down++;
      if (s.down > 4) {
        if (s.clock <= 0) return endGame(s);
        return changeOnDowns(s);
      }
    }
    if (s.clock <= 0) endGame(s);
  }

  // ---------- special plays ----------
  function runoffBeforeSnap(s, side, seconds) {
    if (!s.clockRunning) return false;
    const sec = seconds ?? (side === "you" ? TEMPO_RUNOFF[s.tempo] : cpuTempo(s));
    tick(s, Math.min(sec, s.clock));
    if (s.clock <= 0) { endGame(s); return true; }
    return false;
  }
  function cpuTempo(s) {
    const lead = s.opp.score - s.you.score;
    return lead > 0 ? TEMPO_RUNOFF.milk : TEMPO_RUNOFF.hurry;
  }

  function doSpecial(s, side, type) {
    const O = s[side];
    const who = side === "you" ? s.you.name : s.opp.nick;
    if (type === "timeout") {
      const caller = side;
      if (s[caller].to <= 0 || !s.clockRunning) return;
      s[caller].to--;
      s.clockRunning = false;
      log(s, `⏸ Timeout, ${caller === "you" ? s.you.name : s.opp.nick} (${s[caller].to} left).`, "whistle");
      return;
    }
    if (type === "spike") {
      if (runoffBeforeSnap(s, side, 7)) return;
      tick(s, 1);
      s.clockRunning = false;
      s.last = { kind: "spike", side };
      log(s, `${nameOf(O, "QB", "QB")} spikes the ball to stop the clock.`, "info");
      s.down++;
      if (s.down > 4) return changeOnDowns(s);
      if (s.clock <= 0) endGame(s);
      return;
    }
    if (type === "kneel") {
      if (runoffBeforeSnap(s, side)) return;
      tick(s, 1);
      s.clockRunning = true;
      s.last = { kind: "kneel", side };
      log(s, `${nameOf(O, "QB", "QB")} takes a knee.`, "info");
      s.ballOn = Math.max(1, s.ballOn - 1);
      s.toGo += 1;
      s.down++;
      if (s.clock <= 0) return endGame(s);
      if (s.down > 4) return changeOnDowns(s);
      return;
    }
    if (type === "fg") {
      if (runoffBeforeSnap(s, side, side === "opp" && s.clock < 20 ? 3 : undefined)) return;
      const dist = 100 - s.ballOn + 17;
      const p = fgProb(dist, O.units.K, O.units.KLong);
      tick(s, 4);
      s.clockRunning = false;
      const good = rand() < p;
      s.last = { kind: "fg", good, dist, side };
      if (good) {
        score(s, side, 3);
        log(s, `🥅 ${dist}-yard field goal by ${nameOf(O, "K", "K")} is GOOD!`, side === "you" ? "td" : "bad", { big: true });
        return afterScoreKick(s, side);
      }
      log(s, `${dist}-yard field goal attempt is NO GOOD!`, side === "you" ? "bad" : "good", { big: true });
      const spot = s.ballOn - 7;
      setPossession(s, other(side), Math.max(20, 100 - spot));
      if (s.clock <= 0) endGame(s);
      return;
    }
    if (type === "punt") {
      if (runoffBeforeSnap(s, side)) return;
      tick(s, 7);
      let net = Math.round(normal(41, 6));
      let land = s.ballOn + net;
      let recvBall = land >= 100 ? 20 : 100 - land;
      s.last = { kind: "punt", side };
      log(s, `Punt, ${Math.min(net, 100 - s.ballOn)} yards. ${land >= 100 ? "Touchback." : ""}`, "info");
      setPossession(s, other(side), recvBall);
      if (s.clock <= 0) endGame(s);
      return;
    }
    if (type === "hail") {
      if (runoffBeforeSnap(s, side)) return;
      const D = s[other(side)];
      const res = resolveHailMary(s, O, D);
      return applyResult(s, res, null, null);
    }
  }

  // ---------- main entry points ----------
  function userOffense(s, offId) {
    if (s.phase !== "play" || s.poss !== "you") return;
    if (runoffBeforeSnap(s, "you")) return;
    const off = ALL_OFF_PLAYS[offId];
    const def = cpuDefenseCall(s);
    const res = off.kind === "run" ? resolveRun(s, off, def, s.you, s.opp) : resolvePass(s, off, def, s.you, s.opp);
    applyResult(s, res, off, def);
    cpuDefensiveTimeout(s);
  }

  function userSpecial(s, type) {
    if (s.phase !== "play") return;
    if (type === "timeout") return doSpecial(s, "you", "timeout");
    if (s.poss !== "you") return;
    doSpecial(s, "you", type);
    cpuDefensiveTimeout(s);
  }

  // CPU on defense uses timeouts when it is losing and the clock is running
  function cpuDefensiveTimeout(s) {
    if (s.phase !== "play" || s.poss !== "you" || !s.clockRunning || s.opp.to <= 0) return;
    if (s.opp.score < s.you.score && s.clock < 170) doSpecial(s, "opp", "timeout");
  }

  // When the CPU has the ball: handle any pre-snap special action.
  // Returns "needDefense" if the user should now call a defense.
  function cpuTurn(s) {
    if (s.phase !== "play" || s.poss !== "opp") return "none";
    const d = cpuOffenseDecision(s);
    if (d.type === "play") return "needDefense";
    doSpecial(s, "opp", d.type);
    return d.type;
  }

  function userDefense(s, defId) {
    if (s.phase !== "play" || s.poss !== "opp") return;
    if (runoffBeforeSnap(s, "opp")) return;
    const def = ALL_DEF_PLAYS[defId];
    const off = cpuOffenseCall(s);
    const res = off.kind === "run" ? resolveRun(s, off, def, s.opp, s.you) : resolvePass(s, off, def, s.opp, s.you);
    applyResult(s, res, off, def);
  }

  // ---------- end of game ----------
  function endGame(s) {
    if (s.phase === "over") return;
    s.clock = 0;
    s.clockRunning = false;
    s.phase = "over";
    let { score: ys } = s.you, { score: os } = s.opp;
    let ot = null;
    if (ys === os) {
      const p = clamp(0.5 + (s.you.ovr - s.opp.ovr) * 0.025, 0.2, 0.8);
      const win = rand() < p;
      const pts = pick([3, 3, 6]);
      ot = win ? `${s.you.name} win it in overtime with a ${pts === 3 ? "field goal" : "touchdown"}!` : `${s.opp.nick} win it in overtime with a ${pts === 3 ? "field goal" : "touchdown"}.`;
      if (win) s.you.score += pts; else s.opp.score += pts;
      log(s, `OVERTIME — ${ot}`, win ? "td" : "bad", { big: true });
    }
    s.result = { win: s.you.score > s.opp.score, ot };
    log(s, `FINAL: ${s.you.name} ${s.you.score}, ${s.opp.nick} ${s.opp.score}`, s.result.win ? "td" : "bad", { big: true });
  }

  // ---------- scenarios ----------
  function makeScenario() {
    const youOffense = rand() < 0.6;
    const clock = rand() < 0.3 ? 120 : randInt(62, 150);
    const toW = () => weighted({ 0: 1, 1: 3, 2: 3, 3: 3 }) | 0;
    let margin, ballOn;
    if (youOffense) {
      margin = Number(weighted({ 0: 1, 1: 1, 2: 1, 3: 3, 4: 3, 5: 1, 6: 2, 7: 3, 8: 2 }));
      ballOn = randInt(12, 35);
    } else {
      margin = Number(weighted({ 1: 1, 2: 1, 3: 3, 4: 3, 5: 1, 6: 2, 7: 3, 8: 1 }));
      ballOn = randInt(18, 38);
    }
    const low = randInt(10, 27);
    const sc = {
      clock, poss: youOffense ? "you" : "opp", ballOn,
      youTO: toW(), oppTO: toW(),
      youScore: youOffense ? low : low + margin,
      oppScore: youOffense ? low + margin : low,
      margin, youOffense,
    };
    return sc;
  }

  function scenarioGoal(sc) {
    if (sc.youOffense) {
      const m = sc.margin;
      if (m === 0) return "Tied game. Drive for the winning score.";
      if (m <= 3) return `Down ${m}. A field goal ${m === 3 ? "ties it" : "wins it"} — a touchdown wins it.`;
      if (m <= 6) return `Down ${m}. You need a touchdown.`;
      if (m === 7) return "Down 7. Score a touchdown to tie (or go for 2 to win).";
      return "Down 8. You need a touchdown AND a two-point conversion.";
    }
    return `Up ${sc.margin}. Get a stop to protect the lead.`;
  }

  const api = {
    newGame, makeScenario, scenarioGoal, userOffense, userDefense, userSpecial, cpuTurn,
