  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

  // Defender (or chaser) heading to a point, limited by running speed.
  function chase(start, tStart, target, tEnd, durSec, exact, offset) {
    const speed = 8.5; // yards per second
    const avail = Math.max(0.05, (tEnd - tStart) * durSec);
    const want = [target[0] + (offset ? offset[0] : 0), target[1] + (offset ? offset[1] : 0)];
    const dd = dist(start, want);
    let end = want;
    if (!exact && dd > speed * avail) {
      const f = (speed * avail) / dd;
      end = [lerp(start[0], want[0], f), lerp(start[1], want[1], f)];
    }
    return [[0, start[0], start[1]], [tStart, start[0], start[1]], [tEnd, end[0], end[1]], [1, end[0], end[1]]];
  }

  function build(pre, last, post, info) {
    const offSide = pre.poss, defSide = offSide === "you" ? "opp" : "you";
    const dir = offSide === "you" ? 1 : -1;
    const losX = offSide === "you" ? pre.ballOn : 100 - pre.ballOn;
    const toGoal = 100 - pre.ballOn;
    const P = window.PLAYBOOK || {};
    const offPlay = last.offId && P.ALL_OFF_PLAYS ? P.ALL_OFF_PLAYS[last.offId] : null;
    const defPlay = last.defId && P.ALL_DEF_PLAYS ? P.ALL_DEF_PLAYS[last.defId] : null;
    const dset = defSet(defPlay ? defPlay.tags : []);
    const offR = rosterFor(info, offSide, "off"), defR = rosterFor(info, defSide, "def");
    const cols = colorsFor(info);
    const offC = offSide === "you" ? cols.you : cols.opp, defC = offSide === "you" ? cols.opp : cols.you;

    const offScore = post[offSide].score - pre.scores[offSide];
    const defScore = post[defSide].score - pre.scores[defSide];
    const td = offScore >= 6, defTD = defScore >= 6, safety = defScore === 2 && last.kind !== "fg";

    const actors = {};
    const A = (id, team, start, info2) => (actors[id] = { id, team, start, path: [[0, start[0], start[1]]], ...info2 });
    for (const [spot, xy] of Object.entries(OFF_SET)) A("o" + spot, "off", xy, { p: offR[spot], c: offC, spot });
    for (const [spot, xy] of Object.entries(dset)) A("d" + spot, "def", xy, { p: defR[spot], c: defC, spot });

    let dur = 3.0; // seconds
    let ball = []; // segments
    let banner = { text: "", kind: "info" };
    let labelIds = [];
    let camFollow = null;
    const goodFor = (offGood) => ((offGood ? offSide : defSide) === "you" ? "good" : "bad");

    const endLocal = (yards) => {
      if (td) return toGoal + 3;
      if (safety) return -pre.ballOn - 1.5;
      return clamp(yards, -pre.ballOn + 0.5, toGoal - 0.5);
    };
    // Default motions for linemen
    function linePush(forward, tEngage, side) {
      for (const k of ["LT", "LG", "C", "RG", "RT"]) {
        const a = actors["o" + k], s = a.start;
        a.path = [[0, s[0], s[1]], [tEngage, s[0] + forward, s[1] + side * 0.6], [1, s[0] + forward * 1.4, s[1] + side * 0.9]];
      }
      for (const k of ["DE1", "DT1", "DT2", "DE2"]) {
        const a = actors["d" + k], s = a.start;
        a.path = [[0, s[0], s[1]], [tEngage, Math.max(0.2, s[0] + forward * 0.8 - 0.6), s[1] + side * 0.5]];
      }
    }
    function pursue(target, tReact, tEnd, tacklerId, excludeIds = [], team = "def") {
      // everyone on `team` chases target; tackler arrives exactly
      let best = null, bestD = 1e9;
      for (const a of Object.values(actors)) {
        if (a.team !== team || excludeIds.includes(a.id)) continue;
        const from = at(a.path, tReact);
        const dd = dist(from, target);
        if (!tacklerId && dd < bestD) { bestD = dd; best = a.id; }
      }
      const tk = tacklerId || best;
      for (const a of Object.values(actors)) {
        if (a.team !== team || excludeIds.includes(a.id)) continue;
        const from = at(a.path, tReact);
        const keep = a.path.filter((w) => w[0] < tReact);
        const exact = a.id === tk;
        const off = exact ? [0, 0] : [rr(-2.5, 2.5), rr(-2.5, 2.5)];
        const ch = chase(from, tReact, target, exact ? tEnd : Math.min(1, tEnd + 0.05), dur, exact, off);
        a.path = [...keep, [tReact, from[0], from[1]], ch[2], ch[3]];
      }
      return tk;
    }
    const snapSeg = (toId, t1 = 0.06) => ({ t0: 0, t1, type: "air", from: [-0.4, 0], toActor: toId, h: 0.6 });

    const kind = last.kind;

    // ================= RUN =================
    if (kind === "run") {
      const cat = offPlay ? offPlay.cat : "inside";
      const id = offPlay ? offPlay.id : "iz";
      const side = rand() < 0.5 ? -1 : 1;
      const dEnd = endLocal(last.yards);
      const outside = cat === "outside";
      let yEnd = outside ? side * rr(8, 15) : side * rr(0.5, 4);
      if (last.oob && !td) yEnd = side * (MID + 1.2);
      const rb = actors.oRB, qb = actors.oQB;
      const tMesh = id === "draw" ? 0.26 : 0.16;
      const tEnd = 0.84;
      qb.path = [[0, -4.5, 0], [tMesh, -4.8, side * 0.4], [0.55, -6.5, -side * 1.5], [1, -6.8, -side * 1.6]];
      const pts = [[0, -7, 0]];
      if (id === "counter") pts.push([0.1, -6.6, -side * 1.6]);
      if (id === "toss") pts.push([0.22, -5.5, side * 4]);
      else pts.push([tMesh, -4.9, side * 0.5]);
      if (outside) pts.push([0.42, -1.5, side * 7]);
      else pts.push([0.38, 0.6, side * 1.4]);
      if (dEnd > 3) pts.push([lerp(0.42, tEnd, 0.5), (0.6 + dEnd) / 2, (pts[pts.length - 1][2] + yEnd) / 2]);
      pts.push([tEnd, dEnd, yEnd]);
      pts.push([1, dEnd + (td || last.oob ? 1.5 : 0.4), yEnd + (last.oob ? side * 1 : 0)]);
      rb.path = pts;
      linePush(1.4, 0.3, outside ? side : 0);
      // TE blocks, WRs stalk-block
      actors.oTE.path = [[0, ...actors.oTE.start], [0.35, 1.8, actors.oTE.start[1] + side * 0.4]];
      for (const k of ["WR1", "WR2", "WR3"]) { const s = actors["o" + k].start; actors["o" + k].path = [[0, ...s], [0.4, s[0] + 4, s[1] * 0.92], [1, s[0] + 6, s[1] * 0.85]]; }
      // defense: corners and safeties react
      for (const k of ["CB1", "CB2", "SS", "FS", "LB1", "MLB", "LB2"]) { const s = actors["d" + k].start; actors["d" + k].path = [[0, ...s], [0.2, s[0] + 0.3, s[1] * 0.97]]; }
      const target = [dEnd, yEnd];
      const tk = pursue(target, 0.3, tEnd, null, td ? ["dCB1", "dCB2", "dSS", "dFS", "dLB1", "dMLB", "dLB2", "dDE1", "dDT1", "dDT2", "dDE2"].slice(0, 0) : []);
      if (td) { for (const a of Object.values(actors)) if (a.team === "def") { const L = a.path[a.path.length - 1]; a.path[a.path.length - 1] = [1, L[1] - 3, L[2]]; } }
      ball = [snapSeg("oQB"), { t0: 0.06, t1: id === "toss" ? 0.14 : tMesh, type: "carry", actor: "oQB" }];
      if (id === "toss") ball.push({ t0: 0.14, t1: 0.22, type: "air", fromActor: "oQB", toActor: "oRB", h: 1.5 });
      ball.push({ t0: id === "toss" ? 0.22 : tMesh, t1: 1, type: "carry", actor: "oRB" });
      labelIds = ["oRB"];
      if (last.fumble && !td) {
        ball[ball.length - 1].t1 = tEnd;
        const rec = [dEnd + rr(-1, 1.5), yEnd + rr(-2, 2)];
        ball.push({ t0: tEnd, t1: 0.95, type: "air", fromActor: "oRB", to: rec, h: 1.2 });
        ball.push({ t0: 0.95, t1: 1, type: "carry", actor: tk });
        const a = actors[tk]; a.path = [...a.path.filter((w) => w[0] < tEnd), [tEnd, dEnd, yEnd], [0.95, rec[0], rec[1]], [1, rec[0], rec[1]]];
        banner = { text: "FUMBLE!", kind: goodFor(false) };
        labelIds = ["oRB", tk];
      } else if (td) banner = { text: "TOUCHDOWN!", kind: goodFor(true) };
      else if (safety) banner = { text: "SAFETY!", kind: goodFor(false) };
      else banner = { text: last.yards > 0 ? `+${last.yards} YDS` : last.yards === 0 ? "NO GAIN" : `${last.yards} YDS`, kind: last.yards >= 4 ? goodFor(true) : last.yards <= 0 ? goodFor(false) : "info" };
      dur = 2.6 + Math.min(1.4, Math.abs(dEnd) / 25);
    }

    // ================= PASS (complete / incomplete / int / sack) =================
    else if (["complete", "incomplete", "int", "sack"].includes(kind)) {
      const id = offPlay ? offPlay.id : last.hail ? "hail" : "verts";
      const cat = offPlay ? offPlay.cat : "deep";
      const depth = offPlay ? offPlay.depth || "short" : "deep";
      const screen = cat === "screen";
      const hail = !!last.hail;
      let tgtKey = last.tgtKey || "WR1";
      const tgtSpot = tgtKey === "RB" ? "RB" : tgtKey === "TE" ? "TE" : tgtKey === "WR2" ? "WR2" : "WR1";
      const tgt = actors["o" + tgtSpot];
      const sy = tgt.start[1];
      const qb = actors.oQB;
      const dropD = depth === "deep" || hail ? -8 : screen ? -6 : -7;
      const tThrow = screen ? 0.22 : depth === "short" ? 0.3 : depth === "mid" ? 0.38 : 0.44;

      // catch point
      let air = kind === "complete" ? last.air ?? Math.max(2, last.yards - 3) : kind === "int" ? last.airYards : offPlay ? Math.round(offPlay.air + rr(-2, 3)) : 25;
      if (hail) air = Math.min(toGoal + 2, 58);
      air = clamp(air, -4, toGoal + 4);
      let cy;
      const sidelineIds = ["outs", "comeback", "smash", "hitch"];
      if (screen) { air = id === "rbscreen" ? -2.5 : rr(-1, 1); cy = id === "rbscreen" ? sgn(rand() - 0.5) * 7 : sy + sgn(sy) * 2; }
      else if (hail) cy = rr(-6, 6);
      else if (sidelineIds.includes(id) || cat === "sideline") cy = sgn(sy) * clamp(Math.abs(sy) + 2, 14, 23.5);
      else if (id === "yankee") cy = -sgn(sy || 1) * rr(5, 10);
      else if (id === "verts") cy = sy * 0.85;
      else if (id === "mills" || id === "dagger" || id === "levels" || id === "slant" || id === "mesh") cy = sgn(sy || 1) * rr(2, 8);
      else cy = sy * 0.6 + rr(-3, 3);
      if (tgtSpot === "TE" && !screen) cy = clamp(cy, -14, 14);
      const catchPt = [air, cy];
      const qbSpot = [dropD, 0];
      const flight = clamp(0.05 + dist(qbSpot, catchPt) * 0.0065, 0.07, 0.32);
      const tCatch = tThrow + flight;

      // QB dropback
      qb.path = [[0, -4.5, 0], [0.2, dropD, 0], [tThrow, dropD + 0.4, 0]];
      // OL pass pro, DL rush
      for (const k of ["LT", "LG", "C", "RG", "RT"]) { const a = actors["o" + k], s = a.start; a.path = [[0, ...s], [0.25, s[0] - 1.8, s[1] * 1.15], [1, s[0] - 2.4, s[1] * 1.2]]; }
      for (const k of ["DE1", "DT1", "DT2", "DE2"]) { const a = actors["d" + k], s = a.start; a.path = [[0, ...s], [0.3, -2.2, s[1] * 0.9], [1, -3, s[1] * 0.75]]; }
      if (defPlay && defPlay.tags.includes("blitz")) for (const k of ["LB1", "MLB"]) { const a = actors["d" + k], s = a.start; a.path = [[0, ...s], [0.35, -3.2, s[1] * 0.6], [1, -4.5, s[1] * 0.4]]; }

      // receivers: target route + clear-outs
      const route = (key, pts) => { const a = actors["o" + key]; a.path = [[0, ...a.start], ...pts]; };
      const goDepth = Math.min(toGoal + 3, depth === "deep" || hail ? rr(26, 34) : rr(14, 20));
      for (const k of ["WR1", "WR2", "WR3", "TE"]) {
        if (k === tgtSpot) continue;
        const s = actors["o" + k].start;
        if (depth === "deep" || hail) route(k, [[0.5, Math.min(goDepth * 0.6, toGoal + 2), s[1] * 0.95], [1, Math.min(goDepth, toGoal + 3), s[1] * 0.9]]);
        else if (k === "TE") route(k, [[0.35, 5, s[1] + 1], [1, 6.5, s[1] + 4]]);
        else route(k, [[0.35, Math.min(9, toGoal), s[1] * 0.95], [0.6, Math.min(11, toGoal + 1), s[1] * 0.8], [1, Math.min(11, toGoal + 1), s[1] * 0.75]]);
      }
      if (tgtSpot !== "RB") route("RB", [[0.25, -5.5, 2.2], [1, -5.8, 2.4]]); // pass protection
      // target route
      const brk = screen ? [tgt.start[0] - 0.5, tgt.start[1] + (tgtSpot === "RB" ? 2 : -sgn(sy) * 1)] : [Math.max(1, Math.min(air - 3, air * 0.65)), lerp(sy, cy, 0.25)];
      tgt.path = [[0, ...tgt.start], [Math.min(tThrow, 0.3), ...brk], [tCatch, ...catchPt]];

      // coverage: corners mirror their receivers, safeties drift deep, LBs drop
      const shadow = (defKey, offKey, cushion) => {
        const a = actors["d" + defKey], r = actors["o" + offKey];
        const pts = [[0, ...a.start]];
        for (const t of [0.2, 0.35, tThrow, tCatch]) { const q = at(r.path, Math.max(0, t - 0.03)); pts.push([t, q[0] + cushion, q[1] - sgn(q[1]) * 0.8]); }
        a.path = pts.sort((u, v) => u[0] - v[0]);
      };
      shadow("CB1", "WR1", 1.4); shadow("CB2", "WR2", 1.4);
      for (const k of ["LB1", "LB2", "MLB"]) { const a = actors["d" + k]; if (defPlay && defPlay.tags.includes("blitz") && k !== "LB2") continue; const s = a.start; a.path = [[0, ...s], [0.4, Math.max(s[0], 7.5), s[1] * 1.3]]; }
      for (const k of ["SS", "FS"]) { const a = actors["d" + k], s = a.start; a.path = [[0, ...s], [0.4, Math.max(s[0], 12), s[1] * 0.9]]; }
      const coverKey = { WR1: "dCB1", WR2: "dCB2", TE: "dSS", RB: "dMLB" }[tgtSpot] || "dFS";

      ball = [snapSeg("oQB")];
      labelIds = ["oQB"];
      if (kind === "sack") {
        const sackD = Math.max(last.yards, -pre.ballOn - 1);
        const tSack = 0.5;
        qb.path = [[0, -4.5, 0], [0.2, dropD, 0], [0.38, dropD + 0.5, rr(-2, 2)], [tSack, sackD, rr(-1.5, 1.5)], [1, sackD - 0.3, 0]];
        const sacker = "dDT1";
        const q = at(qb.path, tSack);
        const sa = actors[sacker]; sa.path = [[0, ...sa.start], [0.3, -2, sa.start[1]], [tSack, q[0] + 0.6, q[1] + 0.4], [1, q[0], q[1] + 0.2]];
        ball.push({ t0: 0.06, t1: 1, type: "carry", actor: "oQB" });
        if (last.fumble) banner = { text: "STRIP SACK!", kind: goodFor(false) };
        else if (safety) banner = { text: "SAFETY!", kind: goodFor(false) };
        else banner = { text: `SACK ${last.yards}`, kind: goodFor(false) };
        labelIds = ["oQB", sacker];
        // everyone else freezes routes (cut short)
        dur = 2.6;
      } else {
        ball.push({ t0: 0.06, t1: tThrow, type: "carry", actor: "oQB" });
        const arc = clamp(dist(qbSpot, catchPt) * 0.35, 1.2, 14);
        if (kind === "complete") {
          ball.push({ t0: tThrow, t1: tCatch, type: "air", fromActor: "oQB", to: catchPt, h: arc });
          const dEnd = endLocal(last.yards);
          let yEnd = last.oob && !td ? sgn(cy || sy || 1) * (MID + 1) : clamp(cy + rr(-4, 4), -24, 24);
          const tEnd = 0.88;
          tgt.path.push([tEnd, dEnd, yEnd], [1, dEnd + (td ? 1.5 : 0.4), yEnd]);
          ball.push({ t0: tCatch, t1: 1, type: "carry", actor: tgt.id });
          // cover man arrives late, everyone pursues
          pursue([dEnd, yEnd], tCatch, tEnd, td ? null : coverKey);
          if (td) for (const a of Object.values(actors)) if (a.team === "def") { const L = a.path[a.path.length - 1]; a.path[a.path.length - 1] = [1, L[1] - 2.5, L[2]]; }
          labelIds = ["oQB", tgt.id];
          if (last.fumble && !td) banner = { text: "FUMBLE!", kind: goodFor(false) };
          else if (td) banner = { text: last.hail ? "HAIL MARY TD!" : "TOUCHDOWN!", kind: goodFor(true) };
          else banner = { text: `+${last.yards} YDS`, kind: last.yards >= 8 ? goodFor(true) : "info" };
          if (last.oob && !td) banner.text += " · OUT";
          dur = 2.8 + Math.min(1.4, Math.abs(dEnd) / 30);
        } else if (kind === "incomplete") {
          const miss = [catchPt[0] + rr(1, 3), catchPt[1] + rr(-2, 2)];
          ball.push({ t0: tThrow, t1: tCatch + 0.04, type: "air", fromActor: "oQB", to: miss, h: arc });
          ball.push({ t0: tCatch + 0.04, t1: 1, type: "ground", at: miss });
          tgt.path.push([tCatch + 0.1, catchPt[0] + 2, catchPt[1]], [1, catchPt[0] + 3, catchPt[1]]);
          const cv = actors[coverKey];
          cv.path = [...cv.path.filter((w) => w[0] < tThrow), [tThrow, ...at(cv.path, tThrow)], [tCatch, catchPt[0] + 0.8, catchPt[1] + 0.6], [1, catchPt[0] + 1.5, catchPt[1] + 0.8]];
          banner = { text: last.hail ? "BATTED DOWN" : "INCOMPLETE", kind: goodFor(false) };
          labelIds = ["oQB", tgt.id];
          dur = 2.6;
        } else if (kind === "int") {
          ball.push({ t0: tThrow, t1: tCatch, type: "air", fromActor: "oQB", to: catchPt, h: arc });
          const picker = coverKey;
          const pa = actors[picker];
          pa.path = [...pa.path.filter((w) => w[0] < tThrow), [tThrow, ...at(pa.path, tThrow)], [tCatch, catchPt[0] + 0.3, catchPt[1]]];
          tgt.path.push([1, catchPt[0] + 1.5, catchPt[1]]);
          // return
          let retD;
          if (defTD) retD = -pre.ballOn - 3;
          else {
            const absX = post.poss === "you" ? post.ballOn : 100 - post.ballOn;
            retD = (absX - losX) * dir;
          }
          const retY = clamp(catchPt[1] + rr(-8, 8), -24, 24);
          pa.path.push([0.92, retD, retY], [1, retD - (defTD ? 1.5 : 0.3), retY]);
          ball.push({ t0: tCatch, t1: 1, type: "carry", actor: picker });
          // offense chases
          pursue([retD, retY], tCatch + 0.04, 0.92, defTD ? null : "oQB", [], "off");
          if (defTD) for (const a of Object.values(actors)) if (a.team === "off") { const L = a.path[a.path.length - 1]; a.path[a.path.length - 1] = [1, L[1] + 2.5, L[2]]; }
          banner = { text: defTD ? "PICK SIX!" : "INTERCEPTED!", kind: goodFor(false) };
          labelIds = ["oQB", picker];
          dur = 3.2 + Math.min(1.2, Math.abs(retD - catchPt[0]) / 30);
        }
      }
      camFollow = true;
    }

    // ================= SPECIALS =================
    else if (kind === "kneel" || kind === "spike") {
      const qb = actors.oQB;
      qb.path = [[0, -4.5, 0], [0.25, -1.2, 0], [1, -1.2, 0]];
      // QB under center for these
      qb.start = [-1.2, 0]; qb.path = [[0, -1.2, 0], [0.4, kind === "kneel" ? -1.6 : -1.4, 0]];
      ball = [snapSeg("oQB", 0.15)];
      if (kind === "spike") ball.push({ t0: 0.15, t1: 0.3, type: "carry", actor: "oQB" }, { t0: 0.3, t1: 0.42, type: "air", fromActor: "oQB", to: [-0.6, 0.5], h: 0.4 }, { t0: 0.42, t1: 1, type: "ground", at: [-0.6, 0.5] });
      else ball.push({ t0: 0.15, t1: 1, type: "carry", actor: "oQB" });
      for (const a of Object.values(actors)) if (a.id !== "oQB") { const s = a.start; a.path = [[0, ...s], [0.3, s[0] + (a.team === "off" ? 0.3 : -0.3), s[1]]]; }
      banner = { text: kind === "kneel" ? "KNEEL DOWN" : "SPIKE", kind: "info" };
      dur = 1.6;
      labelIds = ["oQB"];
    } else if (kind === "punt" || kind === "fg") {
      const fg = kind === "fg";
      // re-spot: punter/holder + kicker
      const qb = actors.oQB, rb = actors.oRB;
      if (fg) { qb.start = [-7, 0]; rb.start = [-9.5, -1.2]; } else { qb.start = [-14, 0]; rb.start = [-3, 1.5]; }
      qb.p = fg ? { num: qb.p.num, ovr: qb.p.ovr } : { num: GENERIC_NUM.P, name: null, ovr: 74 };
      rb.p = fg ? (offSide === "you" && info.youPlayers.K ? { ...info.youPlayers.K } : { num: info.oppNums?.K ?? GENERIC_NUM.K, ovr: info.oppUnits?.K ?? 78 }) : rb.p;
      for (const a of Object.values(actors)) a.path = [[0, ...a.start]];
      let land;
      if (fg) {
        land = [toGoal + 10.5, last.good ? rr(-1.5, 1.5) : sgn(rand() - 0.5) * rr(3.6, 6)];
        rb.path.push([0.18, -8.2, -0.5], [1, -7.6, -0.3]);
        ball = [{ t0: 0, t1: 0.15, type: "air", from: [-0.4, 0], toActor: "oQB", h: 0.6 }, { t0: 0.15, t1: 0.22, type: "carry", actor: "oQB" }, { t0: 0.22, t1: 0.8, type: "air", fromActor: "oQB", to: land, h: 18 }, { t0: 0.8, t1: 1, type: "ground", at: land, hidden: true }];
        banner = { text: last.good ? "IT'S GOOD!" : "NO GOOD!", kind: goodFor(last.good) };
        labelIds = ["oRB"];
        // rush

        }

        dur = 3.2;
      }
      camFollow = true;
    }

    return { actors, ball, banner, dur, losX, dir, labelIds, camFollow, fdX: losX + dir * pre.toGo, info };
  }

  // Ball position at normalized time t: [d, y, height]
  function ballAt(anim, t) {
    for (const seg of anim.ball) {
      if (t >= seg.t0 && t <= seg.t1) {
        if (seg.type === "carry") { const p = at(anim.actors[seg.actor].path, t); return [p[0] + 0.2, p[1] + 0.35, 0.6]; }
        if (seg.type === "ground") return [seg.at[0], seg.at[1], 0, seg.hidden];
        if (seg.type === "air") {
          const from = seg.from || at(anim.actors[seg.fromActor].path, seg.t0);
          const to = seg.to || at(anim.actors[seg.toActor].path, seg.t1);
          const u = (t - seg.t0) / (seg.t1 - seg.t0 || 1);
          return [lerp(from[0], to[0], u), lerp(from[1], to[1], u), 0.6 + seg.h * 4 * u * (1 - u)];
        }
      }
    }
    const L = anim.ball[anim.ball.length - 1];
    if (!L) return [0, 0, 0];
    if (L.type === "carry") { const p = at(anim.actors[L.actor].path, 1); return [p[0], p[1], 0.6]; }
    if (L.type === "ground") return [L.at[0], L.at[1], 0, L.hidden];
    return [L.to ? L.to[0] : 0, L.to ? L.to[1] : 0, 0];
  }

  function drawFrame(anim, t, bannerAlpha) {
    const info = anim.info;
    const toAbs = ([d, y]) => [anim.losX + anim.dir * d, MID + y];
    const b = ballAt(anim, t);
    const bAbs = toAbs(b);
    setCam(bAbs[0], false);
    drawField(info);
    drawLines(anim.losX, anim.fdX);
    const carrierSeg = anim.ball.find((s) => s.type === "carry" && t >= s.t0 && t <= s.t1);
    const list = Object.values(anim.actors).sort((a, b2) => (a.team === "def") - (b2.team === "def"));
    for (const a of list) {
      const p = toAbs(at(a.path, t));
      const hot = carrierSeg && carrierSeg.actor === a.id;
      const showLabel = anim.labelIds.includes(a.id) && a.p && (a.p.short || a.p.name);
      drawPlayer(a.p, p[0], p[1], { ...a.c, hot, face: a.team === "off" ? anim.dir : -anim.dir, label: showLabel ? (a.p.short || a.p.name) : null });
    }
    if (!b[3]) drawBall(bAbs[0], bAbs[1], b[2]);
    if (bannerAlpha > 0 && anim.banner.text) drawBanner(anim.banner.text, anim.banner.kind, bannerAlpha);
  }

  function play(pre, last, post, info, onDone) {
    view.info = info;
    view.g = post;
    ensureCanvas();
    resize();
    let anim;
    try { anim = build(pre, last, post, info); } catch (e) { console.error(e); onDone(); return; }
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const total = (reduce ? 0.5 : 1) * anim.dur * 1000;
    const hold = 900;
    const startCam = anim.losX + anim.dir * 6;
    setCam(startCam, true);
    view.anim = anim;
    let t0 = performance.now();
    view.skip = false;
    cancelAnimationFrame(view.raf);
    const step = (now) => {
      if (view.skip) { view.skip = false; t0 = now - total - hold + 450; }
      const el = now - t0;
      const t = Math.min(1, el / total);
      const bannerA = el < total * 0.82 ? 0 : el < total ? (el - total * 0.82) / (total * 0.18) : 1;
      drawFrame(anim, t, bannerA);
      if (el < total + hold) view.raf = requestAnimationFrame(step);
      else { view.anim = null; onDone(); }
    };
    view.raf = requestAnimationFrame(step);
  }

  function show(g, info) {
    view.g = g; view.info = info;
    ensureCanvas();
    if (!view.anim) requestAnimationFrame(() => drawIdle());
  }

  function skip() { if (view.anim) view.skip = true; }
  function onPick(fn) { view.onPick = fn; }
  window.FIELD = { ensureCanvas, show, play, drawIdle, skip, onPick, isAnimating: () => !!view.anim };
})();

        <div class="how-step"><b>2</b><h3>Call real plays</h3><p>Choose a play type, then one of three real plays — Smash, Four Verticals, Cover 2, Fire Zone and more. Every play beats some calls and loses to others.</p></div>

    `;

    }));

    document.getElementById("randomDraft").onclick = () => { saveName(); startDraft(true); };

  // =================================================================
  // DRAFT
  // =================================================================
  function startDraft(random) {
    state.roster = {};
    state.draftOrder = shuffle(SLOTS.map((s) => s.key));
    state.draftRound = 0;
    state.rerolls = 3;
    if (random === true) { randomizeRest(); return; }
    rollChoices();
    go("draft");
  }
  // Fill every open roster spot with a random player at that position
  function randomizeRest() {
    while (state.draftRound < SLOTS.length) {
      const slot = currentSlot();
      const taken = new Set(Object.values(state.roster).map((p) => p.id));
      const all = PLAYERS.filter((p) => p.pos === slot.pos && !taken.has(p.id));
      const pool = all.filter(affordable);
      const choice = pool.length ? pick(pool) : all.sort((a, b) => salary(a) - salary(b))[0];
      state.roster[slot.key] = { ...choice, slot: slot.key };
      state.draftRound++;
    }
    state.randomDrafted = true;
    finishDraft();
  }
  function currentSlot() { return SLOTS.find((s) => s.key === state.draftOrder[state.draftRound]); }
  function rollChoices() {
    const slot = currentSlot();
    const taken = new Set(Object.values(state.roster).map((p) => p.id));
    const pool = PLAYERS.filter((p) => p.pos === slot.pos && !taken.has(p.id));
    let picks = shuffle(pool).slice(0, 5);
    const ok = picks.filter(affordable).length;
    if (ok < 2) {
      const cheap = shuffle(pool.filter((p) => affordable(p) && !picks.includes(p))).slice(0, 2 - ok);
      picks = [...picks.sort((a, b) => salary(a) - salary(b)).slice(0, 5 - cheap.length), ...cheap];
    }
    state.choices = picks.sort((a, b) => b.ovr - a.ovr);
  }
  function playerCard(p, i) {
    const acc = [];
    if (p.pb) acc.push(`${p.pb}× Pro Bowl`);
    if (p.ap) acc.push(`${p.ap}× All-Pro`);
    const can = affordable(p);
    return `<button class="pcard ${tierClass(p.ovr)} ${can ? "" : "over"}" data-pick="${i}" style="--d:${i * 60}ms" ${can ? "" : 'aria-disabled="true"'}>
      <div class="pcard-top">
        <div class="pcard-helmet">${playerHelmet(p, { size: 70 })}</div>
        <div class="tier-tag ${tierClass(p.ovr)}">${tierName(p.ovr)}<small>${p.ovr} OVR</small></div>
      </div>
      <div class="pcard-name">${esc(p.name)}</div>
      <div class="pcard-meta">#${p.num} · ${p.pos}${p.spot ? ` (${p.spot})` : ""} · ${esc(p.team)} · ${yearsText(p)}</div>
      <div class="pcard-stats-label">Per-season avg (17 games)</div>
      <div class="pcard-stats">${p.statLine.map((s) => `<span>${esc(s)}</span>`).join("")}</div>
      <div class="pcard-acc">${acc.join(" · ") || "&nbsp;"}</div>
      <div class="pcard-sal"><span>Salary</span><b>${money(salary(p))}</b>${can ? "" : `<em>Over the cap</em>`}</div>
    </button>`;
  }
  function rosterBoard(compact) {
    return `<div class="board ${compact ? "compact" : ""}">${SLOTS.map((s) => {
      const p = state.roster[s.key];
      const isNow = state.screen === "draft" && s.key === state.draftOrder[state.draftRound];
      return `<div class="slot ${p ? "filled" : ""} ${isNow ? "now" : ""}">
        <div class="slot-pos">${s.label}</div>
        ${p ? `<span class="slot-h" data-pid="${esc(p.id)}" role="button" tabindex="0" aria-label="${esc(p.name)} player info">${playerHelmet(p, { size: 40 })}</span><div class="slot-name">${esc(p.name)}</div>`
             : `<div class="slot-empty">${isNow ? "On the clock" : "—"}</div>`}
      </div>`;
    }).join("")}</div>`;
  }
  function renderDraft() {
    const slot = currentSlot();
    const ovr = partialOvr(state.roster);
    $app.innerHTML = `
      <div class="draft">
        <aside class="card roster-card">
          <div class="roster-head"><h2>${esc(state.teamName)}</h2>${ovr ? `<div class="team-ovr">Avg ${ovr}</div>` : ""}</div>
          ${capMeter()}
          ${rosterBoard()}
        </aside>
        <section class="draft-main">
          <div class="draft-head">
            <div>
              <p class="eyebrow">Round ${state.draftRound + 1} of ${SLOTS.length}</p>
              <h2>Pick your ${POS_NAMES[slot.pos]}</h2>
            </div>
            <div class="draft-actions">
              <button class="btn ghost" id="reroll" ${state.rerolls ? "" : "disabled"}>↻ Re-roll (${state.rerolls})</button>
              <button class="btn ghost" id="randRest">🎲 Randomize the rest</button>
            </div>
          </div>
          ${ratingLegend()}
          <div class="choices">${state.choices.map(playerCard).join("")}</div>
          <p class="note">Ratings compare each player to every other player at his position, using career per-season averages plus Pro Bowl / All-Pro rate. Passing and receiving numbers are adjusted for era.</p>
        </section>
      </div>`;
    document.getElementById("randRest").onclick = randomizeRest;
    document.getElementById("reroll").onclick = () => { if (state.rerolls > 0) { state.rerolls--; rollChoices(); renderDraft(); } };
    $app.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => {
      const p = state.choices[+b.dataset.pick];
      if (!affordable(p)) { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
      state.roster[slot.key] = { ...p, slot: slot.key };
      state.randomDrafted = false;
      state.draftRound++;
      if (state.draftRound >= SLOTS.length) { finishDraft(); return; }
      rollChoices();
      renderDraft();
    }));
  }
  function finishDraft() {
    const { units, names } = teamUnits(state.roster);
    state.team = { name: state.teamName, nick: state.teamName, units, names, ovr: unitsOvr(units) };
    state.run = null;
    go("team");
  }

  // =================================================================
  // TEAM REVIEW

  function lineupRow(keys, opts = {}) {
    return `<div class="lineup">${keys.map((k) => helmetTag(state.roster[k], { showOvr: true, size: opts.size || 60 })).join("")}</div>`;
  }
  function renderTeam() {

    const unitBars = [["Passing", (u.QB * 0.6 + (u.WR1 + u.WR2) / 2 * 0.4)], ["Rushing", (u.RB * 0.6 + u.OL * 0.4)], ["Pass Rush", u.DL], ["Coverage", ((u.CB1 + u.CB2) / 2 * 0.7 + u.S * 0.3)], ["Run D", (u.DL * 0.5 + u.LB * 0.5)], ["Kicking", u.K]]
      .map(([n, v]) => `<div class="ubar"><span>${n}</span><div class="ubar-track"><i style="width:${clamp((v - 60) / 39 * 100, 4, 100)}%"></i></div><b>${Math.round(v)}</b></div>`).join("");
    $app.innerHTML = `

        </div>
        <div class="grid2">
          <div class="card"><h3 class="unit-h">Offense</h3>${lineupRow(OFF_KEYS)}</div>
          <div class="card"><h3 class="unit-h">Defense &amp; K</h3>${lineupRow([...DEF_KEYS, "K"])}</div>
        </div>

        <div class="cta-row">

    document.getElementById("redraft").onclick = () => startDraft();

  }

  // =================================================================
  // CHAMPIONSHIP RUN
  // =================================================================
  function startRun() {
    state.run = { round: 0, results: [], used: [] };
    store.runs++; saveStore(store);
    setupRound();
  }
  function setupRound() {
    const r = ROUNDS[state.run.round];
    const opp = makeOpponent(r.ovr + Math.round((rand() - 0.5) * 4), state.run.used);
    state.run.used.push(opp.nick);
    state.run.opp = opp;
    state.run.scenario = E.makeScenario();
    go("pregame");
  }
  function bracket() {
    return `<div class="bracket">${ROUNDS.map((r, i) => {
      const res = state.run.results[i];
      const cls = res === true ? "won" : res === false ? "lost" : i === state.run.round ? "now" : "";
      return `<div class="br ${cls}"><span>${r.short}</span>${res === true ? "✓" : res === false ? "✗" : ""}</div>`;
    }).join('<div class="br-line"></div>')}</div>`;
  }
  function renderPregame() {
    const r = ROUNDS[state.run.round];
    const opp = state.run.opp;
    const sc = state.run.scenario;
    const t = state.team;

    $app.innerHTML = `
      <section class="pregame">
        ${bracket()}
        <p class="eyebrow center">${r.name}</p>
        <div class="matchup card">
          <div class="mteam">${helmet("", c.hex, c.num, { size: 84 })}<h3>${esc(t.name)}</h3><div class="ovr-badge ${tierClass(t.ovr)}"><span>${t.ovr}</span><small>OVR</small></div></div>
          <div class="vs">VS</div>
          <div class="mteam">${helmet("", opp.color, opp.numColor, { size: 84 })}<h3>${esc(opp.name)}</h3><div class="ovr-badge ${tierClass(opp.ovr)}"><span>${opp.ovr}</span><small>OVR</small></div></div>
        </div>
        <div class="scenario card ${sc.youOffense ? "off" : "def"}">
          <div class="sc-tag">${sc.youOffense ? "COMEBACK DRIVE" : "PROTECT THE LEAD"}</div>
          <div class="sc-score"><span>${esc(t.name)} <b>${sc.youScore}</b></span><span>${esc(opp.nick)} <b>${sc.oppScore}</b></span></div>
          <div class="sc-line">4th quarter · <b>${E.fmtClock(sc.clock)}</b> left · ${ballSide}</div>

    document.getElementById("kickoff").onclick = () => {
      const opp = state.run.opp;
      state.game = E.newGame({ you: { ...state.team }, opp: { ...opp }, scenario: state.run.scenario });

      go("game");
      maybeCpu();
    };
  }

  // =================================================================
  // GAME
  // =================================================================
  function downText(g) {
    const ord = ["", "1st", "2nd", "3rd", "4th"][g.down] || "4th";
    const goal = g.ballOn + g.toGo >= 100;
    return `${ord} & ${goal ? "Goal" : g.toGo}`;
  }
  function tos(n) { return `<span class="tos">${[0, 1, 2].map((i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`; }

  // Info the field view needs: colors, names, numbers
  function fieldInfo(g) {
    const c = teamColors();
    const t = state.team;
    const byName = {};
    Object.values(state.roster).forEach((p) => (byName[p.name] = p));
    const youPlayers = {};
    for (const [k, name] of Object.entries(t.names)) {
      const p = byName[name];
      if (p) youPlayers[k] = { num: p.num, name: p.name, short: lastName(p.name), id: p.id, ovr: p.ovr };
    }
    for (const k of ["OL1", "OL2", "K"]) { const p = state.roster[k]; if (p) youPlayers[k] = { num: p.num, name: p.name, short: lastName(p.name), id: p.id, ovr: p.ovr }; }
    const opp = g.opp;
    if (!opp.jerseys) {
      const used = new Set();
      const r = (a, b) => { for (let i = 0; i < 40; i++) { const n = a + Math.floor(Math.random() * (b - a + 1)); if (!used.has(n)) { used.add(n); return n; } } return a; };
      opp.jerseys = { LT: r(70, 79), LG: r(60, 69), C: r(50, 66), RG: r(60, 69), RT: r(70, 79), TE: r(80, 89), QB: r(1, 19), RB: r(20, 39), WR1: r(10, 19), WR2: r(80, 89), WR3: r(0, 9),
        DE1: r(90, 99), DT1: r(90, 99), DT2: r(90, 99), DE2: r(90, 99), LB1: r(50, 59), MLB: r(40, 59), LB2: r(50, 59), CB1: r(20, 29), CB2: r(30, 39), SS: r(20, 49), FS: r(20, 49) };
    }
    return { youColor: c.hex, youNum: c.num, youName: g.you.name, oppColor: opp.color, oppNum: opp.numColor, oppName: opp.nick, youPlayers, oppNums: opp.jerseys,
      youUnits: g.you.units, oppUnits: opp.units };
  }

  function lastPlayBox(g) {
    const e = g.log.find((x) => x.mtext) ;
    const head = g.log[0];
    if (!head) return `<div class="lastplay muted">Make your first call.</div>`;
    const m = head.mtext ? head : null;
    let chip = "";
    if (m) {
      const youOff = g.last && g.last.side === "you";
      const good = (m.matchup > 0) === youOff;
      const label = good ? "Good call" : "Bad call";
      chip = m.matchup !== 0
        ? `<div class="mchip ${good ? "good" : "bad"}">${good ? "✅" : "❌"} ${label}: ${esc(m.mtext)}</div>`
        : `<div class="mchip">${esc(m.off)} vs ${esc(m.def)}</div>`;
    }
    return `<div class="lastplay ${head.kind}">${chip}<div class="lp-text">${esc(head.text)}</div></div>`;
  }

  function renderGame() {
    const g = state.game;
    const c = teamColors();
    const youPoss = g.poss === "you";
    $app.innerHTML = `
      <section class="game">
        <div class="scoreboard">
          <div class="sb-team you ${youPoss ? "poss" : ""}" style="--tc:${c.hex}">

    if (g.phase === "over" && recordedFor !== g) setTimeout(() => { if (recordedFor !== g) showResult(); }, 700);
  }

  function playCards(cat, side) {
    return `<div class="plays">${cat.plays.map((p) => {
      const beats = side === "off" ? p.beats : null;
      const weak = side === "off" ? p.weak : null;
      const tagInfo = side === "off"
        ? `<div class="tags"><span class="t-good">Beats: ${p.beats.map((t) => E.TAG_NAMES[t]).join(", ")}</span><span class="t-bad">Weak vs: ${p.weak.map((t) => E.TAG_NAMES[t]).join(", ")}</span></div>`
        : `<div class="tags"><span>${p.tags.map((t) => E.TAG_NAMES[t]).join(" · ")}</span></div>`;
      return `<button class="play" data-play="${p.id}">
        <div class="play-name">${esc(p.name)}</div>
        ${diagram(p, side)}
        <div class="play-desc">${esc(p.desc)}</div>
        ${tagInfo}
      </button>`;
    }).join("")}</div>`;
  }

  // Simple route / coverage diagrams for each play
  function diagram(p, side) {
    const W = 120, H = 54, los = 38;

    const arrow = (d, cls = "rt") => `<path class="${cls}" d="${d}" fill="none" stroke-width="1.4" marker-end="url(#ah)"/>`;
    let body = "";
    const line = `<line x1="4" y1="${los}" x2="${W - 4}" y2="${los}" stroke="currentColor" stroke-opacity=".25" stroke-dasharray="2 2"/>`;
    const offForm = [O(60, los + 4), O(52, los + 4), O(68, los + 4), O(60, los + 11), O(60, los + 17), O(12, los + 4), O(108, los + 4), O(80, los + 5)].join("");
    const R = {
      iz: arrow(`M60 ${los + 17} L60 ${los + 2} L57 ${los - 14}`),
      power: arrow(`M60 ${los + 17} L66 ${los + 2} L68 ${los - 14}`) + arrow(`M52 ${los + 6} C58 ${los + 9} 66 ${los + 8} 72 ${los + 2}`, "rt2"),
      draw: arrow(`M60 ${los + 17} L60 ${los + 9} L60 ${los - 14}`) + `<circle cx="60" cy="${los + 10}" r="1.6" fill="currentColor"/>`,
      oz: arrow(`M60 ${los + 17} C70 ${los + 14} 82 ${los + 8} 88 ${los - 10}`),
      toss: arrow(`M60 ${los + 17} C78 ${los + 18} 96 ${los + 8} 100 ${los - 14}`),
      counter: arrow(`M60 ${los + 17} L56 ${los + 15} L66 ${los + 4} L70 ${los - 14}`) + arrow(`M52 ${los + 6} C60 ${los + 10} 70 ${los + 8} 74 ${los + 1}`, "rt2"),
      slant: arrow(`M12 ${los + 2} L14 ${los - 6} L30 ${los - 16}`) + arrow(`M80 ${los + 3} L96 ${los - 1}`),
      stick: arrow(`M80 ${los + 3} L80 ${los - 10} L76 ${los - 9}`) + arrow(`M108 ${los + 2} L108 ${los - 20}`, "rt2") + arrow(`M60 ${los + 17} L82 ${los + 2}`, "rt2"),
      hitch: arrow(`M12 ${los + 2} L12 ${los - 12} L14 ${los - 10}`) + arrow(`M108 ${los + 2} L108 ${los - 12} L106 ${los - 10}`),
      smash: arrow(`M108 ${los + 2} L108 ${los - 8} L106 ${los - 6}`) + arrow(`M80 ${los + 3} L80 ${los - 16} L98 ${los - 30}`),
      outs: arrow(`M12 ${los + 2} L12 ${los - 8} L4 ${los - 8}`) + arrow(`M108 ${los + 2} L108 ${los - 8} L116 ${los - 8}`) + arrow(`M80 ${los + 3} L80 ${los - 6} L96 ${los - 6}`, "rt2"),
      comeback: arrow(`M108 ${los + 2} L108 ${los - 26} L112 ${los - 20}`) + arrow(`M12 ${los + 2} L12 ${los - 26} L8 ${los - 20}`, "rt2"),
      dagger: arrow(`M80 ${los + 3} L80 ${los - 32}`, "rt2") + arrow(`M108 ${los + 2} L108 ${los - 20} L70 ${los - 20}`),
      mesh: arrow(`M80 ${los + 3} L72 ${los - 5} L30 ${los - 6}`) + arrow(`M12 ${los + 2} L22 ${los - 3} L92 ${los - 4}`) + arrow(`M108 ${los + 2} L108 ${los - 30}`, "rt2"),
      levels: arrow(`M80 ${los + 3} L80 ${los - 6} L56 ${los - 6}`, "rt2") + arrow(`M108 ${los + 2} L108 ${los - 18} L70 ${los - 18}`),
      verts: arrow(`M12 ${los + 2} L12 ${los - 34}`) + arrow(`M108 ${los + 2} L108 ${los - 34}`) + arrow(`M80 ${los + 3} L82 ${los - 34}`, "rt2") + arrow(`M60 ${los + 17} C40 ${los + 10} 38 ${los - 10} 40 ${los - 34}`, "rt2"),
      mills: arrow(`M108 ${los + 2} L108 ${los - 16} L84 ${los - 16}`, "rt2") + arrow(`M80 ${los + 3} L80 ${los - 16} L64 ${los - 34}`),
      yankee: arrow(`M12 ${los + 2} L12 ${los - 10} L80 ${los - 30}`) + arrow(`M108 ${los + 2} L108 ${los - 18} L94 ${los - 34}`, "rt2") + `<circle cx="60" cy="${los + 12}" r="1.6" fill="currentColor"/>`,
      rbscreen: arrow(`M60 ${los + 17} L40 ${los + 12} L36 ${los - 4}`) + arrow(`M52 ${los + 4} L42 ${los - 2}`, "rt2") + arrow(`M60 ${los + 4} L46 ${los - 1}`, "rt2"),
      bubble: arrow(`M80 ${los + 5} C86 ${los + 10} 94 ${los + 8} 96 ${los - 4}`) + arrow(`M108 ${los + 2} L104 ${los - 6}`, "rt2"),
      tunnel: arrow(`M108 ${los + 2} L108 ${los - 2} L94 ${los + 3} L86 ${los - 10}`) + arrow(`M68 ${los + 4} L84 ${los - 2}`, "rt2"),
    };
    if (side === "off") {
      body = line + offForm + (R[p.id] || "");
    } else {
      // defense: show zones / blitz arrows
      const Dline = [X(52, los - 4), X(60, los - 4), X(68, los - 4), X(76, los - 4)].join("");
      const zones = {
        c2: `<ellipse cx="34" cy="10" rx="26" ry="8" class="zn"/><ellipse cx="86" cy="10" rx="26" ry="8" class="zn"/>`,
        c3: `<ellipse cx="20" cy="10" rx="18" ry="8" class="zn"/><ellipse cx="60" cy="9" rx="18" ry="8" class="zn"/><ellipse cx="100" cy="10" rx="18" ry="8" class="zn"/>`,
        c4: [15, 45, 75, 105].map((cx) => `<ellipse cx="${cx}" cy="10" rx="14" ry="8" class="zn"/>`).join(""),
        prev: [12, 36, 60, 84, 108].map((cx) => `<ellipse cx="${cx}" cy="9" rx="12" ry="7" class="zn"/>`).join("") + `<ellipse cx="60" cy="24" rx="40" ry="5" class="zn"/>`,
        man: [12, 108, 80].map((x) => `<line x1="${x}" y1="${los - 3}" x2="${x}" y2="${los - 9}" stroke="currentColor" stroke-dasharray="1.5 1.5"/>`).join("") + X(12, los - 11) + X(108, los - 11) + X(80, los - 11),
        blitz: [44, 58, 72].map((x) => arrow(`M${x} ${los - 16} L${x + 2} ${los + 6}`, "rt-bad")).join(""),
        box: [40, 48, 72, 80].map((x) => X(x, los - 10)).join(""),
      };
      const pt = p.tags;
      let parts = Dline;
      if (pt.includes("c2") || p.id === "c6") parts += zones.c2;
      if (pt.includes("c3")) parts += zones.c3;
      if (pt.includes("c4") && p.id !== "c6") parts += zones.c4;
      if (p.id === "c6") parts = Dline + `<ellipse cx="34" cy="10" rx="26" ry="8" class="zn"/>` + `<ellipse cx="74" cy="10" rx="12" ry="8" class="zn"/><ellipse cx="102" cy="10" rx="12" ry="8" class="zn"/>`;
      if (pt.includes("prev")) parts += zones.prev;
      if (pt.includes("c1") || pt.includes("c0") || pt.includes("c2m")) parts += zones.man;
      if (pt.includes("c1")) parts += X(60, 6);
      if (pt.includes("c2m")) parts += X(34, 6) + X(86, 6);
      if (pt.includes("blitz")) parts += zones.blitz;
      if (pt.includes("box")) parts += zones.box;
      body = line + parts;
    }
    return `<svg class="diagram" viewBox="0 0 ${W} ${H}"><defs><marker id="ah" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="context-stroke"/></marker></defs>${body}</svg>`;
  }

  function specialBar(g) {
    const u = g.you.units;
    const dist = 100 - g.ballOn + 17;
    const fgP = E.fgProb(dist, u.K, u.KLong);
    const canTO = g.clockRunning && g.you.to > 0;
    const tempo = ["hurry", "normal", "milk"].map((t) => `<button class="seg ${g.tempo === t ? "on" : ""}" data-tempo="${t}">${{ hurry: "Hurry-up", normal: "Normal", milk: "Milk clock" }[t]}</button>`).join("");
    return `<div class="specials">
      <div class="tempo"><span>Tempo</span>${tempo}</div>
      <div class="sbtns">
        <button class="sbtn" data-sp="spike" ${g.clockRunning && g.down < 4 ? "" : "disabled"} title="Stops the clock, costs a down">Spike</button>
        <button class="sbtn" data-sp="timeout" ${canTO ? "" : "disabled"}>Timeout (${g.you.to})</button>
        <button class="sbtn" data-sp="kneel">Kneel</button>
        <button class="sbtn ${fgP > 0.5 ? "hl" : ""}" data-sp="fg" ${dist <= 70 ? "" : "disabled"}>FG ${dist} yd · ${Math.round(fgP * 100)}%</button>
        <button class="sbtn" data-sp="punt" ${g.down === 4 ? "" : "disabled"}>Punt</button>
        <button class="sbtn" data-sp="hail" ${100 - g.ballOn >= 25 ? "" : "disabled"}>Hail Mary</button>
      </div>
    </div>`;
  }

  function callPanel(g) {
    if (g.phase === "over") {
      return `<div class="panel-msg"><h3>${g.result.win ? "Victory!" : "Final"}</h3><div class="choice-row"><button class="btn" data-showresult>Continue →</button></div></div>`;
    }
    if (g.phase === "pat" && g.pending.side === "you") {
      const xp = clamp(0.93 + (g.you.units.K - 82) * 0.003, 0.85, 0.99);
      return `<div class="panel-msg"><h3>Touchdown! Go for one or two?</h3>
        <p>Score: ${esc(g.you.name)} ${g.you.score} – ${esc(g.opp.nick)} ${g.opp.score}</p>
        <div class="choice-row"><button class="btn" data-pat="1">Kick extra point · ${Math.round(xp * 100)}%</button><button class="btn alt" data-pat="2">Go for two · ~48%</button></div></div>`;
    }
    if (g.phase === "kick" && g.pending.side === "you") {
      return `<div class="panel-msg"><h3>Kickoff</h3><p>You still trail by ${g.opp.score - g.you.score}. Try to get the ball back?</p>
        <div class="choice-row"><button class="btn" data-kick="onside">Onside kick · ~12%</button><button class="btn ghost" data-kick="deep">Kick deep</button></div></div>`;
    }
    if (state.busy) return `<div class="panel-msg"><div class="huddle">${esc(g.opp.nick)} at the line…</div></div>`;

    if (g.poss === "you") {
      const cat = OFFENSE_PLAYBOOK.find((c) => c.id === state.offCat);
      return `<div class="panel-head"><h3>Call your play</h3><span class="hint">Pick a play type, then one of 3 plays</span></div>
        <div class="cats">${OFFENSE_PLAYBOOK.map((c) => `<button class="cat ${state.offCat === c.id ? "on" : ""}" data-cat="${c.id}"><i>${c.icon}</i><span>${c.name}</span></button>`).join("")}</div>
        ${cat ? `<p class="cat-blurb">${esc(cat.blurb)}</p>${playCards(cat, "off")}` : `<p class="cat-blurb muted">Choose a play type above.</p>`}
        ${specialBar(g)}`;
    }
    const cat = DEFENSE_PLAYBOOK.find((c) => c.id === state.defCat);
    const canTO = g.clockRunning && g.you.to > 0;
    return `<div class="panel-head"><h3>Call your defense</h3><span class="hint">${esc(g.opp.nick)} ball · pick a front/coverage, then one of 3 calls</span></div>
      <div class="cats def">${DEFENSE_PLAYBOOK.map((c) => `<button class="cat ${state.defCat === c.id ? "on" : ""}" data-cat="${c.id}"><i>${c.icon}</i><span>${c.name}</span></button>`).join("")}</div>
      ${cat ? `<p class="cat-blurb">${esc(cat.blurb)}</p>${playCards(cat, "def")}` : `<p class="cat-blurb muted">Choose a defensive call type above.</p>`}
      <div class="specials"><div class="sbtns"><button class="sbtn" data-sp="timeout" ${canTO ? "" : "disabled"}>Timeout (${g.you.to})</button></div></div>`;
  }

  function wireCallPanel(g) {
    const panel = document.getElementById("callpanel");
    if (!panel) return;
    panel.querySelectorAll("[data-cat]").forEach((b) => (b.onclick = () => {
      if (g.poss === "you") state.offCat = b.dataset.cat; else state.defCat = b.dataset.cat;
      panel.innerHTML = callPanel(g); wireCallPanel(g);
    }));
    panel.querySelectorAll("[data-play]").forEach((b) => (b.onclick = () => {
      if (state.busy || state.animating) return;
      runAction(() => { if (g.poss === "you") E.userOffense(g, b.dataset.play); else E.userDefense(g, b.dataset.play); });
    }));
    panel.querySelectorAll("[data-tempo]").forEach((b) => (b.onclick = () => { g.tempo = b.dataset.tempo; panel.innerHTML = callPanel(g); wireCallPanel(g); }));
    panel.querySelectorAll("[data-sp]").forEach((b) => (b.onclick = () => {
      if (state.busy || state.animating) return;
      runAction(() => E.userSpecial(g, b.dataset.sp));
    }));
    panel.querySelectorAll("[data-showresult]").forEach((b) => (b.onclick = showResult));
    panel.querySelectorAll("[data-pat]").forEach((b) => (b.onclick = () => { E.pat(g, "you", b.dataset.pat); afterAction("you"); }));
    panel.querySelectorAll("[data-kick]").forEach((b) => (b.onclick = () => { E.kickoff(g, "you", b.dataset.kick); afterAction("you"); }));
  }

  function afterAction(beforePoss) {
    const g = state.game;
    if (g.poss !== beforePoss) { state.offCat = null; state.defCat = null; }
    renderGame();
    flashField();
    maybeCpu();
  }
  function flashField() {
    const g = state.game;
    const head = g.log[0];
    if (!head) return;
    const wrap = document.querySelector(".field-wrap");
    if (wrap && head.big) { wrap.classList.remove("flash"); void wrap.offsetWidth; wrap.classList.add("flash"); }
  }

  // Run an engine action; if a snap happened, animate it before showing the result
  function snapshot(g) { return { poss: g.poss, ballOn: g.ballOn, toGo: g.toGo, scores: { you: g.you.score, opp: g.opp.score } }; }
  function runAction(fn) {
    const g = state.game;
    const before = g.poss;
    const pre = snapshot(g);
    const lastBefore = g.last;
    fn();
    animateIfPlayed(pre, lastBefore, () => afterAction(before));
  }
  function animateIfPlayed(pre, lastBefore, done) {
    const g = state.game;
    const played = g.last && g.last !== lastBefore;
    if (!played || store.anim === false) { done(); return; }
    state.animating = true;
    const panel = document.getElementById("callpanel");
    if (panel) panel.classList.add("locked");
    const sk = document.getElementById("skipAnim");
    if (sk) sk.hidden = false;
    const fw = document.getElementById("fieldWrap");
    if (fw) {
      const r = fw.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) fw.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    FIELD.play(pre, g.last, g, fieldInfo(g), () => { state.animating = false; done(); });
  }

  // Let the CPU take any pre-snap actions (timeouts, kneels, field goals…)
  function maybeCpu() {
    const g = state.game;
    if (!g || g.phase !== "play" || g.poss !== "opp" || state.animating) return;
    const pre = snapshot(g);
    const lastBefore = g.last;
    const peek = E.cpuTurn(g);
    if (peek === "needDefense") return;
    if (g.last && g.last !== lastBefore && store.anim !== false) {
      animateIfPlayed(pre, lastBefore, () => afterAction("opp"));
      return;
    }
    // a timeout (or animations off): show it, then continue
    state.busy = true;
    renderGame();
    setTimeout(() => { state.busy = false; renderGame(); maybeCpu(); }, 800);
  }

  FIELD.onPick((id) => showPlayerInfo(id));

  // =================================================================
  // PLAYER INFO (click any helmet)
  // =================================================================
  function showPlayerInfo(id) {
    const p = PLAYERS.find((x) => x.id === id);
    if (!p) return;
    const acc = [];
    if (p.pb) acc.push(`${p.pb}× Pro Bowl`);
    if (p.ap) acc.push(`${p.ap}× 1st-team All-Pro`);
    const seasons = (p.g / 16).toFixed(1);
    showOverlay(`<div class="modal pinfo">
      <div class="pinfo-top">
        <div class="pinfo-helmet">${playerHelmet(p, { size: 120 })}</div>
        <div class="pinfo-head">
          <div class="pinfo-pos">${POS_NAMES[p.pos]}${p.spot ? ` · ${p.spot === "T" ? "Tackle" : p.spot === "G" ? "Guard" : "Center"}` : ""}</div>
          <h2>${esc(p.name)}</h2>
          <div class="pinfo-meta">#${p.num} · ${esc(p.team)} · ${yearsText(p)}</div>
        </div>
      </div>
      <div class="pinfo-rating">
        <div class="pinfo-ovr" style="background:${ovrColor(p.ovr)};color:${ovrNumColor(p.ovr)}"><span>${p.ovr}</span><small>OVR</small></div>
        <div class="pinfo-tier ${tierClass(p.ovr)}">${tierName(p.ovr)} tier</div>
      </div>
      <div class="pinfo-label">Per-season average (17 games)</div>
      <div class="pcard-stats pinfo-stats">${p.statLine.map((x) => `<span>${esc(x)}</span>`).join("")}</div>
      <div class="pinfo-facts">${p.statLine.some((x) => x.includes("GAMES")) ? "" : `<span>${p.g} career games</span>`}<span>~${seasons} seasons</span><span>Salary ${money(salary(p))}</span>${acc.map((a) => `<span class="gold">${a}</span>`).join("")}</div>
      <div class="modal-actions"><button class="btn" data-close>Back</button></div>
    </div>`);
  }
  document.addEventListener("click", (e) => {
    const h = e.target.closest("[data-pid]");
    if (!h || e.target.closest(".pcard")) return;
    e.preventDefault();
    showPlayerInfo(h.dataset.pid);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$overlay.hidden && $overlay.querySelector(".pinfo")) hideOverlay();
    const h = e.target.closest && e.target.closest("[data-pid]");
    if (h && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); showPlayerInfo(h.dataset.pid); }
  });
  $overlay.addEventListener("click", (e) => { if (e.target === $overlay && $overlay.querySelector(".pinfo")) hideOverlay(); });

  // =================================================================
  // RESULTS
  // =================================================================
  let recordedFor = null;
  function showResult() {
    const g = state.game;
    if (!g || !g.result) return;
    const run = state.run;
    const win = g.result.win;
    const isFinal = run.round === ROUNDS.length - 1;
    const first = recordedFor !== g;
    if (first) {
      recordedFor = g;
      run.results[run.round] = win;
      if (win) store.wins++; else store.losses++;
      if (win && isFinal) {
        store.titles++;
        store.hof.unshift({ name: state.team.name, ovr: state.team.ovr, qb: state.roster.QB.name, date: new Date().toLocaleDateString() });
        store.hof = store.hof.slice(0, 20);
      }
      saveStore(store);
      render();
    }
    let title, body, actions;
    if (win && isFinal) {
      title = "🏆 SUPER BOWL CHAMPIONS!";
      body = `${esc(state.team.name)} win it all, ${g.you.score}–${g.opp.score}. Your roster is going into the Hall of Champions.`;
      actions = `<button class="btn ghost" id="rHome">Home</button><button class="btn" id="rDraft">Draft a new team</button>`;
      if (first) confetti();
    } else if (win) {
      title = "Victory!";
      body = `${esc(state.team.name)} ${g.you.score}, ${esc(g.opp.nick)} ${g.opp.score}. ${g.result.ot ? esc(g.result.ot) + " " : ""}On to the ${ROUNDS[run.round + 1].name}.`;
      actions = `<button class="btn" id="rNext">Next: ${ROUNDS[run.round + 1].name} →</button>`;
    } else {
      title = "Season over";
      body = `${esc(g.opp.nick)} ${g.opp.score}, ${esc(state.team.name)} ${g.you.score}. ${g.result.ot ? esc(g.result.ot) + " " : ""}Eliminated in the ${ROUNDS[run.round].name}.`;
      actions = `<button class="btn ghost" id="rRetry">Same team, new run</button><button class="btn" id="rDraft">Redraft</button>`;
    }
    showOverlay(`<div class="modal result ${win ? "win" : "loss"}"><h2>${title}</h2><p>${body}</p>${bracket()}<div class="modal-actions">${actions}</div><button class="link" data-close>View play-by-play</button></div>`);
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = () => { hideOverlay(); fn(); }; };
    on("rNext", () => { run.round++; setupRound(); });
    on("rDraft", () => startDraft());
    on("rHome", () => go("home"));
    on("rRetry", startRun);
  }

  function confetti() {
    const colors = ["#f5b301", "#ffffff", teamColors().hex, "#3ea0ff", "#e5484d"];
    const box = document.createElement("div");
    box.className = "confetti";
    for (let i = 0; i < 120; i++) {
      const s = document.createElement("i");
      s.style.left = Math.random() * 100 + "%";
      s.style.background = pick(colors);
      s.style.animationDelay = Math.random() * 1.2 + "s";
      s.style.animationDuration = 2.4 + Math.random() * 2 + "s";
      s.style.transform = `rotate(${Math.random() * 360}deg)`;
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 5000);
  }

  render();
})();

</script>
</body>
</html>
